<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Builder</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
 #app { width: 100vw; height: 100vh; display: block; }

 #mode { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6;
 font-size: 13px; font-weight: 600; color: #fff; padding: 5px 14px; border-radius: 999px;
 background: rgba(0,0,0,0.55); letter-spacing: 0.5px; pointer-events: none; }
 #mode.edit { background: rgba(52,152,219,0.85); }
 #mode.play { background: rgba(46,204,113,0.85); }

 #tools { position: absolute; top: 42px; left: 50%; transform: translateX(-50%); z-index: 7;
 display: none; gap: 5px; }
 #tools button { padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
 border: 1px solid #3a4553; border-radius: 6px; background: rgba(28,37,48,0.92); color: #cdd6e0; }
 #tools button:hover { background: rgba(38,49,63,0.95); }
 #tools button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }

 #health { position: absolute; top: 12px; left: 12px; z-index: 6; font-size: 18px;
 letter-spacing: 2px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.6); display: none; }
 #hud { position: absolute; top: 40px; left: 12px; z-index: 5; color: #7dd3fc; font-size: 12px;
 font-family: monospace; background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px;
 line-height: 1.6; pointer-events: none; white-space: pre; }

 #crosshair { position: absolute; top: 50%; left: 50%; z-index: 5; width: 6px; height: 6px;
 margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.85);
 pointer-events: none; display: none; }
 #splash { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0;
 transition: opacity 0.15s; }
 #water { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
 transition: opacity 0.2s; background: radial-gradient(circle at 50% 45%,
 rgba(30,120,200,0.22), rgba(12,60,110,0.5)); }
 #marquee { position: absolute; z-index: 9; pointer-events: none; display: none;
 border: 1.5px solid #ff8c42; background: rgba(255,140,66,0.15); }

 #toolbar { position: absolute; top: 12px; right: 12px; z-index: 7; display: none;
 flex-direction: column; gap: 6px; width: 210px; }
 #toolbar .row { display: flex; gap: 6px; }
 #toolbar button { flex: 1; padding: 7px 8px; font-size: 12px; font-weight: 600; cursor: pointer;
 border: 1px solid #3a4553; border-radius: 6px; background: #1c2530; color: #cdd6e0; }
 #toolbar button:hover { background: #26313f; }
 #toolbar button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }

 #props { position: absolute; bottom: 12px; right: 12px; z-index: 7; display: none;
 width: 210px; background: rgba(18,24,32,0.94); border: 1px solid #2a3542; border-radius: 8px;
 padding: 10px; color: #cdd6e0; font-size: 12px; }
 #props h3 { font-size: 12px; margin-bottom: 8px; color: #7dd3fc; }
 #props .hint { font-size: 10px; opacity: 0.5; margin-top: 7px; }
 #props .grid { display: grid; grid-template-columns: 16px 1fr 16px 1fr 16px 1fr; gap: 5px 4px; align-items: center; }
 #props label { opacity: 0.7; text-align: center; }
 #props input[type=number] { width: 100%; background: #0f151d; border: 1px solid #2a3542; color: #e6edf3;
 border-radius: 4px; padding: 3px 4px; font-size: 11px; }
 #props .row2 { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
 #props .row2 span { opacity: 0.7; width: 34px; }
 #props .row2 input, #props .row2 select { flex: 1; background: #0f151d; border: 1px solid #2a3542;
 color: #e6edf3; border-radius: 4px; padding: 3px 4px; font-size: 11px; }
 #props input[type=color] { flex: none; width: 34px; height: 24px; border: none; background: none; cursor: pointer; padding: 0; }
 #props .empty { opacity: 0.5; text-align: center; padding: 8px 0; }

 #texturePanel { position: absolute; left: 12px; top: 12px; bottom: 12px; z-index: 8; display: none;
 width: 290px; background: rgba(16,22,30,0.96); border: 1px solid #2a3542; border-radius: 10px;
 padding: 12px; color: #cdd6e0; font-size: 12px; flex-direction: column; gap: 10px; overflow-y: auto; }
 #texturePanel h3 { font-size: 13px; margin: 0; color: #7dd3fc; display: flex; align-items: center; justify-content: space-between; }
 #texturePanel .closeX { cursor: pointer; color: #8b98a5; font-size: 16px; line-height: 1; }
 #texture3d { width: 100%; height: 160px; background: radial-gradient(circle at 50% 45%, #1a2533, #0d131b);
 border: 1px solid #2a3542; border-radius: 8px; cursor: grab; touch-action: none; }
 #texFaces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
 #texFaces button { padding: 6px 4px; font-size: 11px; background: #1c2530; border: 1px solid #3a4553;
 border-radius: 6px; color: #cdd6e0; cursor: pointer; }
 #texFaces button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }
 #texCanvasWrap { text-align: center; }
 #texCanvas { image-rendering: pixelated; background: #0a0f16; border: 1px solid #3a4553; border-radius: 4px; cursor: crosshair; display: block; margin: 0 auto; }
 #texColorRow { display: flex; align-items: center; gap: 6px; }
 #texColorRow span { opacity: 0.8; width: 52px; }
 #texColorRow input[type=color] { flex: none; width: 34px; height: 26px; border: none; background: none; cursor: pointer; padding: 0; }
 #texTools { display: flex; gap: 6px; }
 #texTools button { flex: 1; padding: 6px 4px; font-size: 11px; background: #1c2530; border: 1px solid #3a4553;
 border-radius: 6px; color: #cdd6e0; cursor: pointer; }
 #texTools button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }
 #texListRow { display: flex; align-items: stretch; gap: 6px; }
 #texListContainer { flex: 1; min-width: 0; }
 .texListHead { font-size: 10px; opacity: 0.65; margin-bottom: 4px; }
 #texList { display: flex; flex-wrap: wrap; gap: 4px; max-height: 52px; overflow-y: auto; }
 #texList .texItem { display: flex; align-items: center; gap: 4px; padding: 3px 6px; font-size: 11px;
  background: #1c2530; border: 1px solid #3a4553; border-radius: 6px; cursor: pointer; white-space: nowrap; }
 #texList .texItem.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }
 #texList .texItem canvas { width: 18px; height: 18px; image-rendering: pixelated; background: #0a0f16; border: 1px solid #2a3542; border-radius: 2px; }
 #texList .texItem .texDel { color: #8b98a5; font-size: 12px; line-height: 1; margin-left: 2px; }
 #texList .texItem .texDel:hover { color: #ff4d5e; }
 #texNewBtn { flex: none; width: 32px; font-size: 18px; font-weight: 700; background: #1c2530;
  border: 1px solid #3a4553; border-radius: 6px; color: #7dd3fc; cursor: pointer; }
 #texNewBtn:hover { background: #26313f; }
 #texResOverlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(8,12,18,0.82); border-radius: 10px; z-index: 3; }
 #texResOverlay.show { display: flex; }
 .texResBox { background: #141c26; border: 1px solid #3a4553; border-radius: 10px; padding: 16px; text-align: center; }
 .texResTitle { font-size: 13px; color: #7dd3fc; margin-bottom: 12px; font-weight: 600; }
 .texResBtns { display: flex; gap: 8px; margin-bottom: 12px; }
 .texResBtns button { padding: 10px 14px; font-size: 12px; font-weight: 600; background: #1c2530;
  border: 1px solid #3a4553; border-radius: 8px; color: #e6edf3; cursor: pointer; }
 .texResBtns button:hover { background: #2d7dd2; border-color: #2d7dd2; }
 .texResBox .texResCancel { padding: 6px 16px; font-size: 11px; background: #2a3542; border: 1px solid #3a4553;
  border-radius: 6px; color: #cdd6e0; cursor: pointer; }

 #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
 justify-content: center; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; z-index: 10; }
 #overlay h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
 #overlay p { font-size: 14px; opacity: 0.8; line-height: 1.8; text-align: center; }
 #overlay kbd { background: #222; border: 1px solid #444; border-radius: 4px; padding: 2px 7px; font-size: 12px; margin: 0 2px; }
</style>
</head>
<body>
<canvas id="app" tabindex="0"></canvas>
<div id="crosshair"></div>
<div id="health"></div>
<div id="water"></div>
<div id="splash"></div>
<div id="marquee"></div>
<div id="hud"></div>
<div id="mode" class="play">PLAY</div>

<div id="tools">
 <button id="tMove" class="on" title="이동 (1)">✥ 이동</button>
 <button id="tRot" title="회전 (2)">⟳ 회전</button>
 <button id="tScale" title="크기 (3)">⤢ 크기</button>
 <button id="tTex" title="텍스처 (4)">⛶ 텍스처</button>
</div>

<div id="toolbar">
 <div class="row"><button id="btnAdd">＋ 파트</button><button id="btnDup">복제</button></div>
 <div class="row"><button id="btnDel">삭제</button><button id="btnSnap" class="on">스냅 1</button></div>
 <div class="row"><button id="btnSave">저장</button><button id="btnLoad">불러오기</button></div>
 <div class="row"><button id="btnExport">내보내기</button><button id="btnImport">가져오기</button></div>
 <div class="row"><button id="btnReset">초기화</button></div>
</div>

<div id="texturePanel">
 <h3><span>텍스처 편집</span><span class="closeX" id="texClose" title="닫기">✕</span></h3>
 <div id="texListRow">
  <div id="texListContainer">
   <div class="texListHead">텍스처 목록</div>
   <div id="texList"></div>
  </div>
  <button id="texNewBtn" title="새 텍스처 추가">＋</button>
 </div>
 <div id="texResOverlay">
  <div class="texResBox">
   <div class="texResTitle">새 텍스처 해상도</div>
   <div class="texResBtns">
    <button data-res="16">16×16</button>
    <button data-res="32">32×32</button>
    <button data-res="64">64×64</button>
    <button data-res="128">128×128</button>
   </div>
   <button id="texResCancel">취소</button>
  </div>
 </div>
 <div id="tex3dWrap"><canvas id="texture3d"></canvas></div>
 <div id="texFaces">
  <button data-face="top">위(Up)</button><button data-face="bottom">아래(Down)</button><button data-face="right">오른쪽</button>
  <button data-face="left">왼쪽</button><button data-face="front">앞</button><button data-face="back">뒤</button>
 </div>
 <div id="texCanvasWrap">
  <canvas id="texCanvas" width="16" height="16"></canvas>
 </div>
 <div id="texTools">
  <button id="texToolPen" class="on">✨ 펜</button>
  <button id="texToolFill">🪣 채우기</button>
  <button id="texToolErase">◻ 지우개</button>
 </div>
 <div id="texColorRow"><span>그리기 색</span><input type="color" id="texColor" value="#ffcc00"></div>
 <div id="texTools">
  <button id="texClear">비우기</button>
  <button id="texApplyToPart">적용</button>
 </div>
 <div class="hint" id="texHint">캔버스에 드래그해 픽셀을 그리세요 · 면 선택 후 그립니다</div>
</div>

<div id="props">
 <h3>속성</h3>
 <div id="propsBody"><div class="empty">파트를 클릭해 선택</div></div>
</div>

<div id="overlay">
 <h1>클릭해서 시작</h1>
 <p>
 <kbd>Tab</kbd> 편집 / 플레이 전환<br>
 플레이: <kbd>WASD</kbd> · 마우스 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 점프<br>
 편집: 파트 클릭 → 축 화살표 드래그 · 속성의 "종류"로 블록 타입 변경
 </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const canvas = document.getElementById('app');
const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
const crosshair = document.getElementById('crosshair');
const splash = document.getElementById('splash');
const waterOverlay = document.getElementById('water');
const healthEl = document.getElementById('health');
let audioCtx = null;
function initAudio() {
 if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
 if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playHurt() {
 if (!audioCtx) return;
 const t = audioCtx.currentTime;
 const osc = audioCtx.createOscillator();
 const gain = audioCtx.createGain();
 osc.type = 'square';
 osc.frequency.setValueAtTime(320, t);
 osc.frequency.exponentialRampToValueAtTime(90, t + 0.18);
 gain.gain.setValueAtTime(0.0001, t);
 gain.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
 gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
 osc.connect(gain); gain.connect(audioCtx.destination);
 osc.start(t); osc.stop(t + 0.22);
}
function updateHearts() {
 let s = '';
 for (let i = 0; i < 10; i++) s += '<span style="color:' + (health > i*10 ? '#ff4d5e' : '#4a2b30') + '">\u2665</span>';
 healthEl.innerHTML = s + ' <span style="color:#fff;font-size:12px;vertical-align:2px">' + Math.max(0, Math.ceil(health)) + '</span>';
}
const modeBadge = document.getElementById('mode');
const toolbar = document.getElementById('toolbar');
const propsEl = document.getElementById('props');
const propsBody = document.getElementById('propsBody');
const toolBtns = {
 move: document.getElementById('tMove'),
 rotate: document.getElementById('tRot'),
 scale: document.getElementById('tScale'),
 tex: document.getElementById('tTex'),
};
const toolsEl = document.getElementById('tools');
let activeTool = 'move';
function setTool(t) { activeTool = t; for (const k in toolBtns) toolBtns[k].classList.toggle('on', k === t); }
for (const k in toolBtns) toolBtns[k].onclick = () => {
 if (k === 'tex') { texTogglePanel(); return; } // 텍스처는 패널 토글만
 setTool(k);
};

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8e8);
scene.fog = new THREE.Fog(0x87b8e8, 60, 160);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(40, 60, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -110; sun.shadow.camera.right = 110;
sun.shadow.camera.top = 110; sun.shadow.camera.bottom = -110;
scene.add(sun);

const groundSize = 200;
const ground = new THREE.Mesh(
 new THREE.PlaneGeometry(groundSize, groundSize),
 new THREE.MeshStandardMaterial({ color: 0x4a7a4a })
);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(groundSize, 100, 0x336633, 0x3d6b3d);
grid.position.y = 0.01; scene.add(grid);

// ---------- Parts ----------
const boxMat = [0xe74c3c, 0xf39c12, 0x3498db, 0x9b59b6, 0x1abc9c];
const TYPES = ['solid', 'water', 'checkpoint', 'lava'];
const parts = [];
let colliders = [];

function applyAppearance(p) {
 const mats = Array.isArray(p.mesh.material) ? p.mesh.material : [p.mesh.material];
 for (const mat of mats) {
 if (p.type === 'water') {
 mat.color.setHex(0x2e8fd8); mat.transparent = true; mat.opacity = 0.5;
 mat.emissive.setHex(0x0a2a44); mat.emissiveIntensity = 0.3;
 mat.side = THREE.DoubleSide; mat.depthWrite = false;
 } else if (p.type === 'checkpoint') {
 mat.color.setHex(0xffffff); mat.transparent = false; mat.opacity = 1;
 mat.emissive.setHex(0xfff0a0); mat.emissiveIntensity = 0.9;
 mat.side = THREE.FrontSide; mat.depthWrite = true;
 } else if (p.type === 'lava') {
 mat.color.setHex(0x5a1000); mat.transparent = false; mat.opacity = 1;
 mat.emissive.setHex(0xff4400); mat.emissiveIntensity = 1.0;
 mat.side = THREE.FrontSide; mat.depthWrite = true;
 } else {
 mat.color.setHex(p.color); mat.transparent = false; mat.opacity = 1;
 mat.emissive.setHex(0x000000); mat.emissiveIntensity = 0;
 mat.side = THREE.FrontSide; mat.depthWrite = true;
 }
 }
 if (p.textureFaces && !p.isSpecial) {
  // per-face 텍스처가 지정된 경우 각면 매터리얼에 해당 텍스처 적용
  const FACES = ['right','left','top','bottom','front','back'];
  for (let i = 0; i < FACES.length; i++) {
   const f = FACES[i];
   if (mats[i] && p.textureFaces[f] && mats[i] !== p.mesh.material) {
    mats[i].map = p.textureFaces[f];
    mats[i].color.setHex(0xffffff);
    mats[i].needsUpdate = true;
   }
  }
 }
}

// ---------- 텍스처 시스템 (Blockbench 스타일) ----------
const texPanel = document.getElementById('texturePanel');
const tex3dCanvas = document.getElementById('texture3d');
const texCanvas = document.getElementById('texCanvas');
const texCtx = texCanvas.getContext('2d');
texCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
tex3dCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
let texActiveFace = 'front';
let texSelectedPart = null;
let texDrawing = false;
let texTool = 'pen';
const DISPLAY_FACES = ['right','left','top','bottom','front','back'];
const FACE_NAMES = { right:'오른쪽', left:'왼쪽', top:'위', bottom:'아래', front:'앞', back:'뒤' };
const TEX_RES_OPTIONS = [16, 32, 64, 128];
// 텍스처 목록: 각 아이템 { id, size, canvases:{면:canvas} }
let texTextures = [];
let texActiveId = null;
let texSeq = 1;
let texDragTextureId = null;
let texDragStartX = 0, texDragStartY = 0, texDragMoved = false;
function getTexCanvas() { return texFaceCanvases[texActiveFace]; }
// 활성 텍스처의 해상도
function getTexSize() {
 const t = texTextures.find(x => x.id === texActiveId);
 return t ? t.size : 16;
}
// 각 면의 텍스처 캔버스 (활성 텍스처)
let texFaceCanvases = {};

function hexToRgb(hex) {
 const n = parseInt(hex.slice(1), 16);
 return [n>>16 & 255, n>>8 & 255, n & 255];
}
function floodFill(ctx, x, y, target, fill) {
 const size = getTexSize();
 const img = ctx.getImageData(0, 0, size, size);
 const d = img.data;
 const idx = (y*size + x) * 4;
 const match = (i) => d[i]===target[0] && d[i+1]===target[1] && d[i+2]===target[2];
 if (match(idx) && !(fill[0]===target[0] && fill[1]===target[1] && fill[2]===target[2])) {
  const stack = [[x,y]]; const visited = new Set();
  while (stack.length) {
   const [cx,cy] = stack.pop();
   const k = cy*size + cx; if (visited.has(k)) continue; visited.add(k);
   const i = k*4;
   if (!match(i)) continue;
   d[i]=fill[0]; d[i+1]=fill[1]; d[i+2]=fill[2]; d[i+3]=255;
   if (cx>0) stack.push([cx-1,cy]); if (cx<size-1) stack.push([cx+1,cy]);
   if (cy>0) stack.push([cx,cy-1]); if (cy<size-1) stack.push([cx,cy+1]);
  }
  ctx.putImageData(img, 0, 0);
 }
}

// 3D 미리보기용 씬/렌더러/카메라
const texScene = new THREE.Scene();
texScene.background = new THREE.Color(0x141c26);
const texRenderer = new THREE.WebGLRenderer({ canvas: tex3dCanvas, antialias: true, alpha: true });
texRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const texCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
texCam.position.set(2.2, 1.8, 2.2);
texCam.lookAt(0, 0, 0);
const texLights = [new THREE.HemisphereLight(0xffffff, 0x334455, 1.0)];
{
 const l = new THREE.DirectionalLight(0xffffff, 1.1); l.position.set(4, 6, 3); texLights.push(l);
}
texScene.add(...texLights);
let texPreviewMesh = null;
let texPreviewRotY = 0, texPreviewRotX = -0.2, texPreviewDragging = false, texPrevX = 0, texPrevY = 0;

function makeFaceCanvas(size, colorHex) {
 const cv = document.createElement('canvas');
 cv.width = size; cv.height = size;
 const ctx = cv.getContext('2d');
 if (colorHex) { ctx.fillStyle = colorHex; ctx.fillRect(0, 0, size, size); }
 return cv;
}
function texBuildFaces() {
 const size = getTexSize();
 const c = {};
 for (const f of DISPLAY_FACES) {
  // 기본: 블록 색상 단색
  const col = '#' + (texSelectedPart ? texSelectedPart.color.toString(16).padStart(6,'0') : '3498db');
  c[f] = makeFaceCanvas(size, col);
 }
 return c;
}

const texSharedTextureCache = new WeakMap();
function texDbg(msg) {
 const el = document.getElementById('texDbg');
 if (el) el.textContent = 'texDbg: ' + msg;
 console.log('[texDbg]', msg);
}
function texCanvasTexture(cv) {

   const size = t.size || 16;

    for (const f of DISPLAY_FACES) {
     canvases[f] = t.faces[f] ? await loadDataURLToCanvas(t.faces[f], size) : makeFaceCanvas(size, defaultCol);

   } else {
    // 편집 중 적용에서 온 형식: { size, canvases: {면: canvas} }
    for (const f of DISPLAY_FACES) {
     canvases[f] = (t.canvases && t.canvases[f]) ? t.canvases[f] : makeFaceCanvas(size, defaultCol);

const axisOrigin = new THREE.Vector3();
const tmpW = new THREE.Vector3();
let sc0 = 0, startComp = 0;

function setNDC(e) { ndc.x = (e.clientX/window.innerWidth)*2-1; ndc.y = -(e.clientY/window.innerHeight)*2+1; }
function closestAxisParam(r, A, u) {
 const O = r.origin, v = r.direction;
 tmpW.copy(A).sub(O);
 const b = u.dot(v), d = u.dot(tmpW), e = v.dot(tmpW);
 const denom = 1 - b*b;
 if (Math.abs(denom) < 1e-6) return 0;
 return (b*e - d) / denom;
}
function refreshOutline() {
 for (const o of outlines) { if (o.parent) o.parent.remove(o); o.geometry.dispose(); o.material.dispose(); }
 outlines.length = 0;
 for (const p of selection) {
 const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(p.w, p.h, p.d));
 const o = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xffee00 }));
 p.mesh.add(o); outlines.push(o);
 }
}
function setSelection(arr) {
 selection = arr.slice();
 selected = selection.length === 1 ? selection[0] : null;
 marqueeSelection = false;
 refreshOutline(); renderProps();
 // 텍스처 패널이 열려 있으면 새 선택에 맞게 갱신
 if (texPanel.style.display === 'flex') {
  if (selected) texSelectPart(selected);
  else texClose();
 }
}
function select(p) { setSelection([p]); }
function deselect() { setSelection([]); }

canvas.addEventListener('mousedown', (e) => {
 if (mode !== 'edit') return;
 setNDC(e);
 ray.setFromCamera(ndc, editCam);
 if (e.button === 0) {
 if (activeTool === 'move' && gizmo.visible) {
 const gh = ray.intersectObjects(gizmoHandles, false);
 if (gh.length) {
 axisName = gh[0].object.userData.axis;
 axisDir.set(axisName==='x'?1:0, axisName==='y'?1:0, axisName==='z'?1:0);
 axisOrigin.copy(selected.mesh.position);
 sc0 = closestAxisParam(ray.ray, axisOrigin, axisDir);
 startComp = axisName==='x' ? selected.mesh.position.x : axisName==='y' ? selected.mesh.position.y : selected.mesh.position.z;
 draggingAxis = true;
 return;
 }
 }
 if (activeTool === 'scale' && scaleGizmo.visible) {
 const sh = ray.intersectObjects(scaleHandleMeshes, false);
 if (sh.length) {
 scaleDim = sh[0].object.userData.dim;
 const hw = new THREE.Vector3(); sh[0].object.parent.getWorldPosition(hw);
 scaleAxisDir.copy(hw).sub(selected.mesh.position).normalize();
 scaleOrigin.copy(selected.mesh.position);
 sc0 = closestAxisParam(ray.ray, scaleOrigin, scaleAxisDir);
 startHalf = (scaleDim==='w'?selected.w : scaleDim==='h'?selected.h : selected.d) / 2;
 scalingAxis = true;
 return;
 }
 }
 const hits = ray.intersectObjects(parts.filter(p => !p.locked).map(p => p.mesh), false);
 if (hits.length) {
 const p = parts.find(pp => pp.mesh === hits[0].object);
 select(p);
 if (activeTool === 'rotate') {
 dragStart = { mx: e.clientX, my: e.clientY, w: p.w, h: p.h, rot: p.rot };
 dragging = true;
 }
 } else {
 deselect();
 orbiting = true; lastX = e.clientX; lastY = e.clientY;
 }
 } else if (e.button === 2) {
 if (selection.length >= 1 && marqueeSelection) { // 박스 선택된 그룹 → 우클릭 드래그로 이동 (Shift 무관)
 groupCentroid.set(0,0,0);
 for (const p of selection) groupCentroid.add(p.mesh.position);
 groupCentroid.multiplyScalar(1 / selection.length);
 if (orbit.phi > SIDE_THRESHOLD) {
 // 옆면 시점 → 세로 평면(카메라 향함), Y 조절
 groupMode = 'y';
 const n = new THREE.Vector3(editCam.position.x - orbit.target.x, 0, editCam.position.z - orbit.target.z);
 if (n.lengthSq() < 1e-6) n.set(0, 0, 1);
 n.normalize();
 groupPlane.setFromNormalAndCoplanarPoint(n, groupCentroid);
 } else {
 // 위에서 봄 → 수평 평면, XZ 조절
 groupMode = 'xz';
 groupPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0,1,0), groupCentroid);
 }
 if (ray.ray.intersectPlane(groupPlane, groupStartHit)) {
 groupStartPos = selection.map(p => p.mesh.position.clone());
 groupDragging = true;
 } else {
 orbiting = true; rmbDown = true; lastX = e.clientX; lastY = e.clientY;
 }
 } else if (e.shiftKey) { // 선택 없을 때 Shift + 우클릭 → 박스 선택(마퀴)
 marqueeActive = true;
 marqueeX0 = e.clientX; marqueeY0 = e.clientY;
 marqueeEl.style.display = 'block';
 updateMarqueeRect(e.clientX, e.clientY);
 } else {
 orbiting = true; rmbDown = true; lastX = e.clientX; lastY = e.clientY;
 }
 }
});
window.addEventListener('mousemove', (e) => {
 if (mode !== 'edit') return;
 if (marqueeActive) { updateMarqueeRect(e.clientX, e.clientY); return; }
 if (groupDragging) {
 setNDC(e);
 ray.setFromCamera(ndc, editCam);
 if (ray.ray.intersectPlane(groupPlane, hitPoint)) {
 if (groupMode === 'y') {
 let dy = hitPoint.y - groupStartHit.y;
 if (snap) dy = Math.round(dy * 2) / 2;
 for (let i = 0; i < selection.length; i++)
 selection[i].mesh.position.y = Math.max(selection[i].h / 2, groupStartPos[i].y + dy);
 } else {
 let dx = hitPoint.x - groupStartHit.x, dz = hitPoint.z - groupStartHit.z;
 if (snap) { dx = Math.round(dx); dz = Math.round(dz); }
 for (let i = 0; i < selection.length; i++) {
 selection[i].mesh.position.x = groupStartPos[i].x + dx;
 selection[i].mesh.position.z = groupStartPos[i].z + dz;
 }
 }
 }
 return;
 }
 if (draggingAxis && selected) {
 setNDC(e);
 ray.setFromCamera(ndc, editCam);
 const sc = closestAxisParam(ray.ray, axisOrigin, axisDir);
 let val = startComp + (sc - sc0);
 if (snap) val = axisName==='y' ? Math.round(val*2)/2 : Math.round(val);
 if (axisName === 'x') selected.mesh.position.x = val;
 else if (axisName === 'y') selected.mesh.position.y = Math.max(selected.h/2, val);
 else selected.mesh.position.z = val;
 renderProps();
 return;
 }
 if (scalingAxis && selected) {
 setNDC(e);
 ray.setFromCamera(ndc, editCam);
 const sc = closestAxisParam(ray.ray, scaleOrigin, scaleAxisDir);
 let newHalf = startHalf + (sc - sc0);
 if (newHalf < 0.1) newHalf = 0.1;
 let dim = newHalf * 2;
 if (snap) { dim = Math.max(0.5, Math.round(dim * 2) / 2); newHalf = dim / 2; }
 const delta = newHalf - startHalf; // 잡은 면만 이동, 반대 면 고정
 if (scaleDim === 'w') selected.w = dim; else if (scaleDim === 'h') selected.h = dim; else selected.d = dim;
 selected.mesh.geometry.dispose();
 selected.mesh.geometry = new THREE.BoxGeometry(selected.w, selected.h, selected.d);
 selected.mesh.position.copy(scaleOrigin).addScaledVector(scaleAxisDir, delta);
 refreshOutline(); renderProps();
 return;
 }
 if (dragging && selected) {
 if (activeTool === 'rotate') {
 let nr = dragStart.rot + (e.clientX - dragStart.mx) * 0.01;
 if (snap) nr = Math.round(nr / (Math.PI/12)) * (Math.PI/12);
 selected.rot = nr; selected.mesh.rotation.y = nr;
 refreshOutline(); renderProps();
 }
 } else if (orbiting) {
 const dx = e.clientX - lastX, dy = e.clientY - lastY;
 lastX = e.clientX; lastY = e.clientY;
 orbit.theta -= dx * 0.005;
 orbit.phi = Math.max(0.15, Math.min(Math.PI/2 + 0.2, orbit.phi - dy * 0.005));
 updateEditCam();
 }
});
window.addEventListener('mouseup', (e) => {
 if (marqueeActive) { finishMarquee(e); }
 dragging = false; orbiting = false; draggingAxis = false; scalingAxis = false; rmbDown = false; groupDragging = false;
});
// 텍스처 목록 좌클릭 드래그 이동/커서 피드백
window.addEventListener('mousemove', (e) => {
 if (texDragTextureId === null) return;
 const dx = e.clientX - texDragStartX, dy = e.clientY - texDragStartY;
 if (!texDragMoved && Math.hypot(dx, dy) > 5) { texDragMoved = true; document.body.style.cursor = 'grabbing'; texDbg('드래그 이동 감지됨(grabbing)'); }
});
const groundFocus = new THREE.Vector3();
const focusObjs = [];
const marqueeEl = document.getElementById('marquee');
function updateMarqueeRect(x, y) {
 const l = Math.min(marqueeX0, x), t = Math.min(marqueeY0, y);
 const w = Math.abs(x - marqueeX0), h = Math.abs(y - marqueeY0);
 marqueeEl.style.left = l + 'px'; marqueeEl.style.top = t + 'px';
 marqueeEl.style.width = w + 'px'; marqueeEl.style.height = h + 'px';
}
const _corner = new THREE.Vector3();
function partFullyInside(p, x0, y0, x1, y1) {
 p.mesh.updateMatrixWorld();
 const hw = p.w/2, hh = p.h/2, hd = p.d/2;
 const W = window.innerWidth, H = window.innerHeight;
 for (let sx = -1; sx <= 1; sx += 2)
 for (let sy = -1; sy <= 1; sy += 2)
 for (let sz = -1; sz <= 1; sz += 2) {
 _corner.set(sx*hw, sy*hh, sz*hd).applyMatrix4(p.mesh.matrixWorld).project(editCam);
 if (_corner.z > 1) return false; // 카메라 뒤
 const px = (_corner.x * 0.5 + 0.5) * W;
 const py = (-_corner.y * 0.5 + 0.5) * H;
 if (px < x0 || px > x1 || py < y0 || py > y1) return false; // 하나라도 밖이면 제외
 }

}
function finishMarquee(e) {
 marqueeEl.style.display = 'none';
 marqueeActive = false;
 const x0 = Math.min(marqueeX0, e.clientX), x1 = Math.max(marqueeX0, e.clientX);
 const y0 = Math.min(marqueeY0, e.clientY), y1 = Math.max(marqueeY0, e.clientY);
 if (x1 - x0 < 4 && y1 - y0 < 4) { return; } // 너무 작으면 무시
 const picked = parts.filter(p => !p.locked && partFullyInside(p, x0, y0, x1, y1));
 setSelection(picked);
 marqueeSelection = picked.length > 0;
}
function raycastFocus(e) {
 setNDC(e);
 ray.setFromCamera(ndc, editCam);
 focusObjs.length = 0;
 for (const p of parts) focusObjs.push(p.mesh);
 focusObjs.push(ground);
 const hits = ray.intersectObjects(focusObjs, false);

}
canvas.addEventListener('wheel', (e) => {
 if (mode !== 'edit') return;

 if (cursorZoom) {
 // 커서가 향한 지점으로 줌: 궤도 중심을 그 지점 쪽으로 이동
 const focus = raycastFocus(e);
 const k = 1 - orbit.radius / oldR; // 줌인이면 +, 줌아웃이면 -
 orbit.target.lerp(focus, k);

}, { passive: false });

 '<label>H</label><input type="number" step="0.5" min="0.2" id="pH" value="'+p.h+'">' +
 '<label>D</label><input type="number" step="0.5" min="0.2" id="pD" value="'+p.d+'">' +
 '</div>' +

 '<div class="hint">화살표로 이동 · Q/E 회전</div>';
 const bind = (id, fn) => document.getElementById(id).addEventListener('input', (e) => { fn(parseFloat(e.target.value)); });

 document.getElementById('pType').addEventListener('change', (e) => {

 });
 document.getElementById('pC').addEventListener('input', (e) => {

 selected.color = c;
 if (selected.type === 'solid') {
  const mats = Array.isArray(selected.mesh.material) ? selected.mesh.material : [selected.mesh.material];
  for (const m of mats) if (m.map) m.map.dispose();
  if (!selected._isSpecialTexture) {
   const mm = Array.isArray(selected.mesh.material) ? selected.mesh.material : [selected.mesh.material];

}

function serialize() {
 return JSON.stringify({ v: 3, parts: parts.map(p => {
  let texData = null;
  if (p.textureFaces && Array.isArray(p.textureFaces._list) && p.textureFaces._list.length) {
   texData = { list: p.textureFaces._list.map(t => ({
    size: t.size || 16,
    faces: (() => {
     const o = {};
     for (const f of DISPLAY_FACES) {
      const cv = t.canvases[f];
      if (cv) o[f] = cv.toDataURL('image/png');
     }
     return o;
    })()
   })) };
  }
  return {
   x: +p.mesh.position.x.toFixed(3), y: +p.mesh.position.y.toFixed(3), z: +p.mesh.position.z.toFixed(3),
   w: p.w, h: p.h, d: p.d, color: p.color, rot: +p.rot.toFixed(4), type: p.type, locked: !!p.locked,
   texture: texData,
   faceOverrides: p.faceOverrides ? Object.fromEntries(
    Object.entries(p.faceOverrides).map(([f, o]) => [f, { size: o.size, data: o.canvas.toDataURL('image/png') }])
   ) : null,
  };
 }) });
}
// 버전 무관 파싱: 예전 형식(배열)도, 새 형식({v,parts})도 모두 지원
function worldFromJSON(str) {
 const data = JSON.parse(str);
 if (Array.isArray(data)) return data;
 if (data && Array.isArray(data.parts)) return data.parts;
 return null;
}
function loadDataURLToCanvas(dataURL, size) {
 const cv = document.createElement('canvas'); cv.width = size; cv.height = size;
 const ctx = cv.getContext('2d');
 return new Promise((res) => {
  const u = new Image();
  u.onload = () => { ctx.drawImage(u, 0, 0, size, size); res(cv); };
  u.onerror = () => res(cv);
  u.src = dataURL;
 });
}
async function loadTextureList(tex) {
 // tex: { size, faces: {면: dataURL} } 또는 기존 { _canvases } 형태
 if (!tex) return null;
 const size = tex.size || 16;
 const c = {};
 if (tex.faces && typeof tex.faces === 'object') {
  for (const f of DISPLAY_FACES) {
   if (tex.faces[f]) c[f] = await loadDataURLToCanvas(tex.faces[f], size);
   else c[f] = makeFaceCanvas(size, null);
  }
  return { size, canvases: c };
 }
 return null;
}
// 저장된 텍스처 데이터 → per-face 캔버스 객체 변환 (addPart에 전달용)
function loadTextureCanvases(tex) {
 if (!tex) return null;
 // 새 형식: { list: [{ size, faces: {면: dataURL} }] } — 첫 텍스처를 메인으로
 if (tex.list && Array.isArray(tex.list) && tex.list.length) {
  const first = tex.list[0];
  const size = first.size || 16;
  const c = {};
  if (first.faces && typeof first.faces === 'object') {
   // 동기적으로 빈 캔버스 먼저 만들고, 이미지 로딩은 비동기 처리
   for (const f of DISPLAY_FACES) c[f] = makeFaceCanvas(size, null);
   for (const f of DISPLAY_FACES) {
    if (first.faces[f]) {
     const img = new Image();
     img.onload = () => { const ctx = c[f].getContext('2d'); ctx.imageSmoothingEnabled = false; ctx.drawImage(img, 0, 0, size, size); };
     img.src = first.faces[f];
    }
   }
   // 해상도 + 전체 목록 정보를 캔버스에 기록해 loadPartTexturesIntoList가 복원 가능하게
   c._size = size;
   c._list = tex.list.map(t => ({ size: t.size || 16, faces: t.faces || {} }));
   return c;
  }
 }
 // 구 형식: { _canvases: {면: canvas} }
 if (tex._canvases && typeof tex._canvases === 'object') return tex._canvases;
 return null;
}
function loadFromData(arr) {
 if (!Array.isArray(arr)) return false;
 while (parts.length) removePart(parts[0]);
 deselect();
 for (const o of arr) {
 if (!o) continue;
 if (o.locked) continue; // 예전 잠긴 외벽은 불러올 때 제거 (맵 밖으로 나갈 수 있게)
 const x = +o.x || 0, y = +o.y || 0, z = +o.z || 0;
 const w = Math.max(0.2, +o.w || 1), h = Math.max(0.2, +o.h || 1), d = Math.max(0.2, +o.d || 1);
 const color = (typeof o.color === 'number') ? o.color : 0x3498db;
 const rot = +o.rot || 0;
 const type = TYPES.includes(o.type) ? o.type : 'solid';
 const tcv = loadTextureCanvases(o.texture);
 const newPart = addPart(x, y, z, w, h, d, color, rot, type, false, tcv);
 // 드래그로 면별 적용된 텍스처(faceOverrides) 복원 — 비동기 이미지 로드 후 머티리얼에 적용
 if (o.faceOverrides) {
  if (!Array.isArray(newPart.mesh.material)) {
   const base = newPart.mesh.material;
   newPart.mesh.material = DISPLAY_FACES.map(() => base.clone());
  }
  newPart.faceOverrides = {};
  newPart.isSpecial = true;
  for (const [f, ov] of Object.entries(o.faceOverrides)) {
   const img = new Image();
   img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = ov.size; cv.height = ov.size;
    cv.getContext('2d').drawImage(img, 0, 0);
    newPart.faceOverrides[f] = { size: ov.size, canvas: cv };
    const idx = DISPLAY_FACES.indexOf(f);
    const mat = newPart.mesh.material[idx];
    mat.map = texCanvasTexture(cv);
    mat.color.setHex(0xffffff);
    mat.needsUpdate = true;
   };
   img.src = ov.data;
  }
 }
 }
 rebuildColliders();
 return true;
}

 try {
 const arr = worldFromJSON(r.result);
 if (arr && loadFromData(arr)) { saveWorld(); flash('가져옴'); }
 else flash('파일 형식 오류');
 } catch (e) { flash('파일 오류'); }
 };
 r.readAsText(file);
 };
 inp.click();
};
document.getElementById('btnReset').onclick = () => { buildDefaultWorld(); rebuildColliders(); saveWorld(); deselect(); flash('초기화'); };

let flashTimer = null;
function flash(msg) {
 modeBadge.textContent = msg;
 clearTimeout(flashTimer);
 flashTimer = setTimeout(() => { modeBadge.textContent = mode === 'edit' ? 'EDIT' : 'PLAY'; }, 900);
}

// ---------- Physics ----------
const WALK = 6, RUN = 11, GRAVITY = 24, JUMP_SPEED = 8, WATER_FACTOR = 0.45;
const SWIM_UP = 5, SINK_SPEED = 1.6;
const MAX_HP = 100, VOID_DMG = 15, VOID_TICK = 0.75; // -140 아래: 15틱(0.05s×15=0.75s)마다 15 데미지
let health = MAX_HP, voidTickT = 0;
let healTickT = 0;
let lastCheckpointKey = null;
let vertVel = 0, onGround = true, inWater = false;
const velocity = new THREE.Vector3();
const forward = new THREE.Vector3(), right = new THREE.Vector3();
const clock = new THREE.Clock();

function respawn() {
 yawObject.position.copy(respawnPoint);
 vertVel = 0; velocity.set(0,0,0);
 health = MAX_HP; voidTickT = 0; updateHearts();
 lastCheckpointKey = null;
 splash.style.background = 'rgba(200,0,0,0.5)';
 splash.style.opacity = '1';
 setTimeout(() => { splash.style.opacity = '0'; }, 120);
}

function physics(dt) {
 const shift = keys['ShiftLeft'] || keys['ShiftRight'];
 const speed = inWater ? (shift ? WALK : WALK * WATER_FACTOR) : (shift ? RUN : WALK);
 const y = yawObject.rotation.y;
 forward.set(-Math.sin(y), 0, -Math.cos(y));
 right.set(Math.cos(y), 0, -Math.sin(y));

 const move = new THREE.Vector3();
 if (keys['KeyW']) move.add(forward);
 if (keys['KeyS']) move.sub(forward);
 if (keys['KeyD']) move.add(right);
 if (keys['KeyA']) move.sub(right);
 if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);

 velocity.lerp(move, 1 - Math.pow(0.001, dt));
 yawObject.position.addScaledVector(velocity, dt);

 const pos = yawObject.position, R = 0.4, H = EYE_HEIGHT;

 // 수평 충돌 (solid + checkpoint만 막힘)
 for (const c of colliders) {
 if (c.type !== 'solid' && c.type !== 'checkpoint') continue;
 const feetY = pos.y - H, headY = pos.y;
 if (feetY >= c.y1 - 0.05 || headY <= c.y0) continue;
 const ca = Math.cos(c.a), sa = Math.sin(c.a);
 const dx = pos.x - c.cx, dz = pos.z - c.cz;
 let lx = dx*ca + dz*sa, lz = -dx*sa + dz*ca;
 const bx = c.hw + R, bz = c.hd + R;
 if (lx > -bx && lx < bx && lz > -bz && lz < bz) {
 const pL = lx+bx, pR = bx-lx, pD = lz+bz, pU = bz-lz;
 const m = Math.min(pL, pR, pD, pU);
 if (m === pL) lx = -bx; else if (m === pR) lx = bx;
 else if (m === pD) lz = -bz; else lz = bz;
 pos.x = c.cx + (lx*ca - lz*sa);
 pos.z = c.cz + (lx*sa + lz*ca);
 }
 }

 // 수직: 물속이면 수영, 아니면 중력+점프
 if (inWater) {
 if (keys['Space']) vertVel = SWIM_UP; // 위로 떠오름
 else if (shift) vertVel = 0; // 유지 (안 가라앉음)
 else vertVel = -SINK_SPEED; // 천천히 가라앉음
 pos.y += vertVel * dt;
 } else {
 if (onGround && keys['Space']) { vertVel = JUMP_SPEED; onGround = false; }
 vertVel -= GRAVITY * dt;
 pos.y += vertVel * dt;
 }
 // 바닥은 맵(그라운드 평면) 범위 안에서만 존재 → 밖은 공허로 낙하
 const half = groundSize / 2;
 let groundY = (Math.abs(pos.x) <= half && Math.abs(pos.z) <= half) ? EYE_HEIGHT : -Infinity;
 for (const c of colliders) {
 if (c.type !== 'solid' && c.type !== 'checkpoint') continue;
 const ca = Math.cos(c.a), sa = Math.sin(c.a);
 const dx = pos.x - c.cx, dz = pos.z - c.cz;
 const lx = dx*ca + dz*sa, lz = -dx*sa + dz*ca;
 if (lx > -(c.hw+R) && lx < (c.hw+R) && lz > -(c.hd+R) && lz < (c.hd+R)) {
 const top = c.y1 + EYE_HEIGHT;
 if (vertVel <= 0 && pos.y <= top + 0.1 && top > groundY) groundY = top;
 }
 }
 if (pos.y <= groundY) { pos.y = groundY; vertVel = 0; onGround = true; } else onGround = false;

 // 공허 낙하: y가 -140 이하로 내려가면 사망 → 부활
 // 공허: y가 -140 아래면 15틱(0.75초)마다 15 데미지, 0되면 사망→부활
 if (pos.y <= -140) {
 voidTickT += dt;
 while (voidTickT >= VOID_TICK) {
 voidTickT -= VOID_TICK;
 health -= VOID_DMG;
 updateHearts();
 playHurt();
 if (health <= 0) { respawn(); break; }
 }
 } else {
 voidTickT = 0;
 }

 // 트리거 판정 (물/체크포인트/용암)
 let nowInWater = false;
 let onCheckpoint = false;
 const feetY = pos.y - H, headY = pos.y;
 for (const c of colliders) {
 const ca = Math.cos(c.a), sa = Math.sin(c.a);
 const dx = pos.x - c.cx, dz = pos.z - c.cz;
 const lx = dx*ca + dz*sa, lz = -dx*sa + dz*ca;
 const inside = lx > -(c.hw+R) && lx < (c.hw+R) && lz > -(c.hd+R) && lz < (c.hd+R);
 if (!inside) continue;
 const yOverlap = feetY < c.y1 && headY > c.y0;
 if (c.type === 'water' && yOverlap) nowInWater = true;
 else if (c.type === 'lava' && yOverlap) { respawn(); return; }
 else if (c.type === 'checkpoint' && Math.abs((pos.y - EYE_HEIGHT) - c.y1) < 0.15) {
 onCheckpoint = true;
 const cpKey = c.cx.toFixed(2) + ',' + c.cz.toFixed(2) + ',' + c.y1.toFixed(2);
 respawnPoint.set(c.cx, c.y1 + EYE_HEIGHT, c.cz);
 if (cpKey !== lastCheckpointKey) { // 새 체크포인트 도달 시에만
 lastCheckpointKey = cpKey;
 flash('✓ 체크포인트 저장');
 }
 }
 }
 // 체크포인트 위에 있으면 10틱(0.5초)마다 5 회복 (하트 반 칸)
 if (onCheckpoint && health < MAX_HP) {
 healTickT += dt;
 while (healTickT >= 0.5) {
 healTickT -= 0.5;
 health = Math.min(MAX_HP, health + 5);
 updateHearts();
 }
 } else {
 healTickT = 0;
 }
 inWater = nowInWater;

 const p = pos;
 hud.textContent = 'x:'+p.x.toFixed(1)+' z:'+p.z.toFixed(1)+'\nspeed '+velocity.length().toFixed(1)+
 '\n'+(onGround?'ground':'air')+(inWater?' · 물속':'')+(onCheckpoint?' · ✓체크포인트':'');
}

// ---------- Loop ----------
// 시작 시 저장본 자동 불러오기 (없으면 기본 월드)
(function initWorld() {
 let loaded = false;
 try {
 const s = localStorage.getItem('fpsWorld');
 if (s) { const arr = worldFromJSON(s); if (arr && arr.length) loaded = loadFromData(arr); }
 } catch (e) {}
 if (!loaded) buildDefaultWorld();
 rebuildColliders();
})();

let autoSaveT = 0;
let glowT = 0;
function updateGlow(dt) {
 glowT += dt;
 for (const p of parts) {
  const mats = Array.isArray(p.mesh.material) ? p.mesh.material : [p.mesh.material];
  if (p.type === 'checkpoint') { for (const m of mats) { m.emissiveIntensity = 0.6 + 0.4 * Math.sin(glowT * 3); } }
  else if (p.type === 'lava') { for (const m of mats) { m.emissiveIntensity = 0.85 + 0.25 * Math.sin(glowT * 5); } }
 }
}

function animate() {
 requestAnimationFrame(animate);
 const dt = Math.min(clock.getDelta(), 0.05);
 updateGlow(dt);
 waterOverlay.style.opacity = (mode === 'play' && inWater) ? '1' : '0';
 if (mode === 'edit') { autoSaveT += dt; if (autoSaveT > 3) { autoSaveT = 0; saveWorld(); } }
 if (mode === 'play') {
 gizmo.visible = false;
 scaleGizmo.visible = false;
 physics(dt); renderer.render(scene, playCam); hud.style.display = 'block'; healthEl.style.display = 'block';
 } else {
 if (selected && activeTool === 'move') {
 gizmo.visible = true;
 gizmo.position.copy(selected.mesh.position);
 const dist = editCam.position.distanceTo(gizmo.position);
 gizmo.scale.setScalar(Math.max(0.5, dist / 32));
 } else {
 gizmo.visible = false;
 }
 if (selected && activeTool === 'scale') {
 scaleGizmo.visible = true;
 scaleGizmo.position.copy(selected.mesh.position);
 scaleGizmo.rotation.y = selected.rot;
 const dist = editCam.position.distanceTo(scaleGizmo.position);
 const s = Math.max(0.5, dist / 45);
 const pad = 0.3 * s;
 const hw = selected.w/2, hh = selected.h/2, hd = selected.d/2;
 for (const a of scaleArrows) {
 const off = (a.dim==='w'?hw : a.dim==='h'?hh : hd) + pad;
 a.group.position.set(a.dir.x*off, a.dir.y*off, a.dir.z*off);
 a.group.scale.setScalar(s);
 }
 } else {
 scaleGizmo.visible = false;
 }
 renderer.render(scene, editCam); hud.style.display = 'none'; healthEl.style.display = 'none';
 }
}
updateHearts();
animate();

canvas.focus();
window.addEventListener('click', () => { canvas.focus(); initAudio(); });

window.addEventListener('resize', () => {
 playCam.aspect = aspect(); playCam.updateProjectionMatrix();
 editCam.aspect = aspect(); editCam.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
});

// 텍스처 목록 좌클릭 드래그 → 블록 특정 면에 적용
window.addEventListener('mouseup', (e) => {
 if (texDragTextureId !== null) texDbg('mouseup 발생, moved=' + texDragMoved + ' mode=' + mode);
 if (texDragTextureId === null) return;
 const wasMoved = texDragMoved;
 const tid = texDragTextureId; texDragTextureId = null; texDragMoved = false;
 document.body.style.cursor = '';
 if (!wasMoved) return; // 그냥 클릭(이동 없음)이면 적용 시도하지 않음 — 목록 클릭 선택과 구분
 if (mode !== 'edit') { flash('편집 모드 아님'); return; }
 setNDC(e);
 ray.setFromCamera(ndc, editCam);
 const hits = ray.intersectObjects(parts.filter(p => !p.locked).map(p => p.mesh), false);
 texDbg('레이캐스트 hits=' + hits.length);
 if (!hits.length) { flash('블록 위에서 놓아야 함'); return; }
 const hitMesh = hits[0].object;
 const p = parts.find(pp => pp.mesh === hitMesh);
 const faceIdx = hits[0].face.materialIndex; // 0~5, DISPLAY_FACES 순서와 동일
 const faceName = DISPLAY_FACES[faceIdx];
 const t = texTextures.find(x => x.id === tid);
 if (!p) { flash('블록을 찾을 수 없음'); return; }
 if (!t) { flash('텍스처 없음(tid=' + tid + ')'); return; }
 if (!t.canvases[faceName]) { flash('면 캔버스 없음: ' + faceName); return; }
 if (!Array.isArray(p.mesh.material)) {
  const base = p.mesh.material;
  p.mesh.material = DISPLAY_FACES.map(() => base.clone());
 }
 const mat = p.mesh.material[faceIdx];
 mat.map = texCanvasTexture(t.canvases[faceName]);
 mat.color.setHex(0xffffff);
 mat.needsUpdate = true;
 if (!p.faceOverrides) p.faceOverrides = {};
 p.faceOverrides[faceName] = { size: t.size, canvas: t.canvases[faceName] }; // 저장용 구조
 p.isSpecial = true;
 texDbg('적용 성공 face=' + faceName + ' part=' + (p ? 'ok' : 'null'));
 flash(FACE_NAMES[faceName] + ' 면에 텍스처 적용됨');
});
</script>
