<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Builder</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
 #app { width: 100vw; height: 100vh; display: block; touch-action: none; }

 #mode { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 6;
 font-size: 13px; font-weight: 600; color: #fff; padding: 5px 14px; border-radius: 999px;
 background: rgba(0,0,0,0.55); letter-spacing: 0.5px; pointer-events: none; }
 #mode.edit { background: rgba(52,152,219,0.85); }
 #mode.play { background: rgba(46,204,113,0.85); }

 #tools { position: absolute; top: 42px; left: 50%; transform: translateX(-50%); z-index: 7;
 display: none; gap: 5px; }
 #tools button { padding: 7px 14px; font-size: 12px; font-weight: 600; cursor: pointer;
 border: 1px solid #3a4553; border-radius: 6px; background: rgba(28,37,48,0.92); color: #cdd6e0; }
 #tools button:hover { background: rgba(38,49,63,0.95); }
 #tools button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }

 #health { position: absolute; top: 12px; left: 12px; z-index: 6; font-size: 18px;
 letter-spacing: 2px; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.6); display: none; }
 #hud { position: absolute; top: 40px; left: 12px; z-index: 5; color: #7dd3fc; font-size: 12px;
 font-family: monospace; background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px;
 line-height: 1.6; pointer-events: none; white-space: pre; }

 #crosshair { position: absolute; top: 50%; left: 50%; z-index: 5; width: 6px; height: 6px;
 margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.85);
 pointer-events: none; display: none; }
 #splash { position: absolute; inset: 0; z-index: 8; pointer-events: none; opacity: 0;
 transition: opacity 0.15s; }
 #water { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
 transition: opacity 0.2s; background: radial-gradient(circle at 50% 45%,
 rgba(30,120,200,0.22), rgba(12,60,110,0.5)); }
 #marquee { position: absolute; z-index: 9; pointer-events: none; display: none;
 border: 1.5px solid #ff8c42; background: rgba(255,140,66,0.15); }

 #toolbar { position: absolute; top: 12px; right: 12px; z-index: 7; display: none;
 flex-direction: column; gap: 6px; width: 210px; }
 #toolbar .row { display: flex; gap: 6px; }
 #toolbar button { flex: 1; padding: 7px 8px; font-size: 12px; font-weight: 600; cursor: pointer;
 border: 1px solid #3a4553; border-radius: 6px; background: #1c2530; color: #cdd6e0; }
 #toolbar button:hover { background: #26313f; }
 #toolbar button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }

 #props { position: absolute; bottom: 12px; right: 12px; z-index: 7; display: none;
 width: 210px; background: rgba(18,24,32,0.94); border: 1px solid #2a3542; border-radius: 8px;
 padding: 10px; color: #cdd6e0; font-size: 12px; }
 #props h3 { font-size: 12px; margin-bottom: 8px; color: #7dd3fc; }
 #props .hint { font-size: 10px; opacity: 0.5; margin-top: 7px; }
 #props .grid { display: grid; grid-template-columns: 16px 1fr 16px 1fr 16px 1fr; gap: 5px 4px; align-items: center; }
 #props label { opacity: 0.7; text-align: center; }
 #props input[type=number] { width: 100%; background: #0f151d; border: 1px solid #2a3542; color: #e6edf3;
 border-radius: 4px; padding: 3px 4px; font-size: 11px; }
 #props .row2 { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
 #props .row2 span { opacity: 0.7; width: 34px; }
 #props .row2 input, #props .row2 select { flex: 1; background: #0f151d; border: 1px solid #2a3542;
 color: #e6edf3; border-radius: 4px; padding: 3px 4px; font-size: 11px; }
 #props input[type=color] { flex: none; width: 34px; height: 24px; border: none; background: none; cursor: pointer; padding: 0; }
 #props .empty { opacity: 0.5; text-align: center; padding: 8px 0; }

 #texturePanel { position: absolute; left: 12px; top: 12px; bottom: 12px; z-index: 8; display: none;
 width: 290px; background: rgba(16,22,30,0.96); border: 1px solid #2a3542; border-radius: 10px;
 padding: 12px; color: #cdd6e0; font-size: 12px; flex-direction: column; gap: 10px; overflow-y: auto; }
 #texturePanel h3 { font-size: 13px; margin: 0; color: #7dd3fc; display: flex; align-items: center; justify-content: space-between; }
 #texturePanel .closeX { cursor: pointer; color: #8b98a5; font-size: 16px; line-height: 1; }
 #texture3d { width: 100%; height: 160px; background: radial-gradient(circle at 50% 45%, #1a2533, #0d131b);
 border: 1px solid #2a3542; border-radius: 8px; cursor: grab; touch-action: none; }
 #texFaces { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
 #texFaces button { padding: 6px 4px; font-size: 11px; background: #1c2530; border: 1px solid #3a4553;
 border-radius: 6px; color: #cdd6e0; cursor: pointer; }
 #texFaces button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }
 #texCanvasWrap { text-align: center; }
 #texCanvas { image-rendering: pixelated; background: #0a0f16; border: 1px solid #3a4553; border-radius: 4px; cursor: crosshair; display: block; margin: 0 auto; }
 #texColorRow { display: flex; align-items: center; gap: 6px; }
 #texColorRow span { opacity: 0.8; width: 52px; }
 #texColorRow input[type=color] { flex: none; width: 34px; height: 26px; border: none; background: none; cursor: pointer; padding: 0; }
 #texTools { display: flex; gap: 6px; }
 #texTools button { flex: 1; padding: 6px 4px; font-size: 11px; background: #1c2530; border: 1px solid #3a4553;
 border-radius: 6px; color: #cdd6e0; cursor: pointer; }
 #texTools button.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }
 #texListRow { display: flex; align-items: stretch; gap: 6px; }
 #texListContainer { flex: 1; min-width: 0; }
 .texListHead { font-size: 10px; opacity: 0.65; margin-bottom: 4px; }
 #texList { display: flex; flex-wrap: wrap; gap: 4px; max-height: 52px; overflow-y: auto; }
 #texList .texItem { display: flex; align-items: center; gap: 4px; padding: 3px 6px; font-size: 11px;
  background: #1c2530; border: 1px solid #3a4553; border-radius: 6px; cursor: pointer; white-space: nowrap;
  user-select: none; -webkit-user-drag: none; }
 #texList .texItem.on { background: #2d7dd2; border-color: #2d7dd2; color: #fff; }
 #texList .texItem canvas { width: 18px; height: 18px; image-rendering: pixelated; background: #0a0f16; border: 1px solid #2a3542; border-radius: 2px;
  -webkit-user-drag: none; pointer-events: none; }
 #texList .texItem .texDel { color: #8b98a5; font-size: 12px; line-height: 1; margin-left: 2px; }
 #texList .texItem .texDel:hover { color: #ff4d5e; }
 #texNewBtn { flex: none; width: 32px; font-size: 18px; font-weight: 700; background: #1c2530;
  border: 1px solid #3a4553; border-radius: 6px; color: #7dd3fc; cursor: pointer; }
 #texNewBtn:hover { background: #26313f; }
 #texResOverlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(8,12,18,0.82); border-radius: 10px; z-index: 3; }
 #texResOverlay.show { display: flex; }
 .texResBox { background: #141c26; border: 1px solid #3a4553; border-radius: 10px; padding: 16px; text-align: center; }
 .texResTitle { font-size: 13px; color: #7dd3fc; margin-bottom: 12px; font-weight: 600; }
 .texResBtns { display: flex; gap: 8px; margin-bottom: 12px; }
 .texResBtns button { padding: 10px 14px; font-size: 12px; font-weight: 600; background: #1c2530;
  border: 1px solid #3a4553; border-radius: 8px; color: #e6edf3; cursor: pointer; }
 .texResBtns button:hover { background: #2d7dd2; border-color: #2d7dd2; }
 .texResBox .texResCancel { padding: 6px 16px; font-size: 11px; background: #2a3542; border: 1px solid #3a4553;
  border-radius: 6px; color: #cdd6e0; cursor: pointer; }

 #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
 justify-content: center; background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; z-index: 10; }
 #overlay p { font-size: 14px; opacity: 0.8; line-height: 1.8; text-align: center; }
 #overlay kbd { background: #222; border: 1px solid #444; border-radius: 4px; padding: 2px 7px; font-size: 12px; margin: 0 2px; }
 #menu { display:flex; flex-direction:column; align-items:center; gap:12px; }
 #startBtn { padding:14px 48px; font-size:18px; font-weight:700; cursor:pointer; border:none;
  border-radius:10px; background:#2ecc71; color:#fff; }
 #startBtn:hover { background:#27ae60; }
 #nickInput { width:220px; padding:10px 14px; font-size:15px; text-align:center; border-radius:8px;
  border:1px solid #3a4553; background:#0f151d; color:#e6edf3; outline:none; }
 #customBtn { width:220px; padding:14px 14px; font-size:15px; text-align:center; border-radius:10px;
  border:none; background:#9b59b6; color:#fff; cursor:pointer; font-weight:700; }
 #customBtn:hover { background:#8e44ad; }
 #customPanel { position:absolute; inset:0; z-index:11; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; background:rgba(10,15,22,0.92); }
 #customCanvas { width:280px; height:340px; background:#1a2230; border-radius:12px; }
 #customClose { padding:10px 28px; font-size:15px; font-weight:700; border:none; border-radius:8px;
  background:#2ecc71; color:#fff; cursor:pointer; }
 #mpBtn { width:220px; padding:14px 14px; font-size:15px; text-align:center; border-radius:10px;
  border:none; background:#2c8fc9; color:#fff; cursor:pointer; font-weight:700; margin-top:8px; }
 #mpBtn:hover { background:#2477ab; }
 #mpPanel { position:absolute; inset:0; z-index:11; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; background:rgba(10,15,22,0.92); }
 #mpHost { padding:12px 30px; font-size:15px; font-weight:700; border:none; border-radius:8px;
  background:#2ecc71; color:#fff; cursor:pointer; }
 #mpCodeInput { width:160px; padding:10px 14px; font-size:15px; text-align:center; border-radius:8px;
  border:1px solid #3a4553; background:#0f151d; color:#e6edf3; outline:none; }
 #mpJoin { padding:10px 22px; font-size:15px; font-weight:700; border:none; border-radius:8px;
  background:#9b59b6; color:#fff; cursor:pointer; }
 #mpClose { padding:10px 28px; font-size:15px; font-weight:700; border:none; border-radius:8px;
  background:#2ecc71; color:#fff; cursor:pointer; }
 #mpRooms { padding:10px 28px; font-size:15px; font-weight:700; border:none; border-radius:8px;
  background:#e67e22; color:#fff; cursor:pointer; }
 #roomAdmin { position:absolute; inset:0; z-index:12; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:12px; background:rgba(10,15,22,0.95); }
 #roomList { max-height:50vh; overflow:auto; color:#e6edf3; min-width:260px; text-align:center; }
 #roomAdminClose { padding:10px 28px; font-size:15px; font-weight:700; border:none; border-radius:8px;
  background:#e74c3c; color:#fff; cursor:pointer; }
 #overlayHelp { margin-top:20px; }

 #touchControls { position:absolute; inset:0; z-index:7; pointer-events:none; }
 #joystick { position:absolute; left:24px; bottom:24px; width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.3); pointer-events:auto; touch-action:none; }
 #joystick.run { background:rgba(46,204,113,0.28); border-color:#2ecc71; }
 #joystick.run #joyKnob { background:rgba(46,204,113,0.85); }
 #joyKnob { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%;
  background:rgba(255,255,255,0.5); }
 #btnJump { position:absolute; right:24px; bottom:40px; width:88px; height:88px; border-radius:50%;
  background:rgba(255,255,255,0.18); border:2px solid rgba(255,255,255,0.35); color:#fff; font-size:15px;
  font-weight:600; pointer-events:auto; touch-action:none; }
 /* 모바일 전용: 모드 전환 버튼 (touchControls 밖, 상태에 따라 위치 변경) */
 #modeToggleButton { position:absolute; z-index:8; display:none; padding:10px 16px;
  border:none; border-radius:8px; color:#fff; font-size:14px; font-weight:700; pointer-events:auto;
  right:24px; bottom:140px; left:auto; top:auto; transform:none; } /* 기본(플레이): 점프 버튼 위 */
 #modeToggleButton.editing { right:auto; bottom:auto; left:12px; top:44px; transform:none; } /* 편집: 좌상단 (HUD 자리 아래) */
 #modeToggleButton.m { background:#2ecc71; } /* 편집모드로 가는 버튼 */
 #modeToggleButton.editing { background:#3498db; } /* 플레이로 가는 버튼 */
</style>
</head>
<body>
<div id="mpDiag" style="position:fixed;top:4px;left:50%;transform:translateX(-50%);z-index:99999;background:#000;color:#0f0;font:bold 12px monospace;padding:4px 10px;border-radius:8px;max-width:90vw;text-align:center;display:none;"></div>
<canvas id="app" tabindex="0"></canvas>
<div id="crosshair"></div>
<div id="health"></div>
<div id="water"></div>
<div id="splash"></div>
<div id="marquee"></div>
<div id="hud"></div>
<div id="mode" class="play">PLAY</div>

<!-- 멀티플레이 채팅 UI -->
<button id="chatBtn" style="position:fixed;left:12px;bottom:12px;z-index:50;width:52px;height:52px;border:none;border-radius:14px;background:#2ecc71;color:#fff;font-size:24px;cursor:pointer;display:none;">💬</button>
<button id="emoteBtn" style="position:fixed;right:12px;bottom:150px;z-index:50;width:52px;height:52px;border:none;border-radius:14px;background:#9b59b6;color:#fff;font-size:24px;cursor:pointer;display:none;">😀</button>
<div id="emoteBar" style="position:fixed;right:12px;bottom:150px;z-index:51;background:rgba(20,28,36,0.95);border-radius:12px;padding:8px;display:none;gap:6px;flex-wrap:wrap;max-width:220px;"></div>
<div id="chatBox" style="position:fixed;left:12px;bottom:12px;z-index:60;width:min(320px,80vw);background:rgba(20,28,36,0.95);border-radius:12px;padding:10px;display:none;flex-direction:column;gap:8px;">
 <div id="chatLog" style="height:180px;overflow-y:auto;color:#e6edf3;font-size:13px;line-height:1.5;"></div>
 <div style="display:flex;gap:6px;">
 <input id="chatInput" maxlength="120" placeholder="메시지..." style="flex:1;padding:8px;border-radius:8px;border:1px solid #33404d;background:#0d1117;color:#fff;font-size:14px;" />
 <button id="chatSend" style="background:#2ecc71;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;">전송</button>
 <button id="chatClose" style="background:#455;color:#fff;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;">✕</button>
 </div>
</div>

<!-- 모바일 전용 모드 전환 버튼 (EDIT 모드에서도 표시되도록 touchControls 밖 배치) -->
<button id="modeToggleButton" class="m" style="display:none;">편집모드</button>

<div id="touchControls" style="display:none;">
 <div id="joystick"><div id="joyKnob"></div></div>
 <button id="btnJump">점프</button>
</div>

<div id="tools">
 <button id="tMove" class="on" title="이동 (1)">✥ 이동</button>
 <button id="tRot" title="회전 (2)">⟳ 회전</button>
 <button id="tScale" title="크기 (3)">⤢ 크기</button>
 <button id="tTex" title="텍스처 (4)">⛶ 텍스처</button>
</div>

<div id="toolbar">
 <div class="row"><button id="btnAdd">＋ 파트</button><button id="btnDup">복제</button></div>
 <div class="row"><button id="btnDel">삭제</button><button id="btnSnap" class="on">스냅 1</button></div>
 <div class="row"><button id="btnSave">저장</button><button id="btnLoad">불러오기</button></div>
 <div class="row"><button id="btnExport">내보내기</button><button id="btnImport">가져오기</button></div>
 <div class="row"><button id="btnReset">초기화</button></div>
</div>

<div id="texturePanel">
 <h3><span>텍스처 편집</span><span class="closeX" id="texClose" title="닫기">✕</span></h3>
 <div id="texListRow">
  <div id="texListContainer">
   <div class="texListHead">텍스처 목록</div>
   <div id="texList"></div>
  </div>
  <button id="texNewBtn" title="새 텍스처 추가">＋</button>
 </div>
 <div id="texResOverlay">
  <div class="texResBox">
   <div class="texResTitle">새 텍스처 해상도</div>
   <div class="texResBtns">
    <button data-res="16">16×16</button>
    <button data-res="32">32×32</button>
    <button data-res="64">64×64</button>
    <button data-res="128">128×128</button>
   </div>
   <button id="texResCancel">취소</button>
  </div>
 </div>
 <div id="tex3dWrap"><canvas id="texture3d"></canvas></div>
 <div id="texFaces">
  <button data-face="top">위(Up)</button><button data-face="bottom">아래(Down)</button><button data-face="right">오른쪽</button>
  <button data-face="left">왼쪽</button><button data-face="front">앞</button><button data-face="back">뒤</button>
 </div>
 <div id="texCanvasWrap">
  <canvas id="texCanvas" width="16" height="16"></canvas>
 </div>
 <div id="texTools">
  <button id="texToolPen" class="on">✨ 펜</button>
  <button id="texToolFill">🪣 채우기</button>
  <button id="texToolErase">◻ 지우개</button>
 </div>
 <div id="texColorRow"><span>그리기 색</span><input type="color" id="texColor" value="#ffcc00"></div>
 <div id="texTools">
  <button id="texClear">비우기</button>
  <button id="texApplyToPart">적용</button>
 </div>
 <div class="hint" id="texHint">캔버스에 드래그해 픽셀을 그리세요 · 면 선택 후 그립니다</div>
</div>

<div id="props">
 <h3>속성</h3>
 <div id="propsBody"><div class="empty">파트를 클릭해 선택</div></div>
</div>

<div id="overlay">
 <div id="menu">
  <button id="startBtn">시작하기</button>
  <input id="nickInput" type="text" maxlength="16" placeholder="닉네임" autocomplete="off">
  <button id="customBtn">🎨 커스텀</button>
  <button id="mpBtn">🌐 멀티플레이</button>
 </div>
 <p id="overlayHelp">
  <kbd>Tab</kbd> 편집 / 플레이 전환 · <kbd>WASD</kbd> 이동 · <kbd>Shift</kbd> 달리기 · <kbd>Space</kbd> 점프
 </p>
</div>

<div id="customPanel" style="display:none;">
 <h2 style="color:#fff;margin-bottom:8px;">커스텀</h2>
 <canvas id="customCanvas"></canvas>
 <div style="display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:12px;">
  <div style="color:#fff;font-size:13px;">피부색</div>
  <div id="palSkin" class="pal" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:280px;"></div>
  <div style="color:#fff;font-size:13px;">상의색</div>
  <div id="palShirt" class="pal" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:280px;"></div>
  <div style="color:#fff;font-size:13px;">바지색</div>
  <div id="palPants" class="pal" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:280px;"></div>
  <div style="color:#fff;font-size:13px;margin-top:8px;">표정</div>
  <div id="palFace" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:280px;"></div>
 </div>
 <button id="customClose">닫기</button>
</div>

<div id="mpPanel" style="display:none;">
 <h2 style="color:#fff">멀티플레이</h2>
 <button id="mpMain" style="background:#e67e22;color:#fff;border:none;border-radius:8px;padding:12px 24px;font-weight:700;cursor:pointer">🌐 메인 서버 접속</button>
 <div id="mpMainInfo" style="color:#7dd3fc;font-size:12px;min-height:16px"></div>
 <button id="mpHost">방 만들기</button>
 <div style="display:flex;gap:6px">
  <input id="mpCodeInput" placeholder="방 코드" autocomplete="off">
  <button id="mpJoin">참가</button>
 </div>
 <div id="mpStatus" style="color:#7dd3fc;font-size:13px;min-height:18px"></div>
 <button id="mpRooms">방 확인</button>
 <button id="mpClose">닫기</button>
</div>

<div id="roomAdmin" style="display:none;">
 <h2 style="color:#fff">방 관리</h2>
 <div id="roomList" style="max-height:50vh;overflow:auto;color:#e6edf3;min-width:260px"></div>
 <button id="roomAdminClose">닫기</button>

function floodFill(ctx, x, y, target, fill) {
 const size = getTexSize();
 const img = ctx.getImageData(0, 0, size, size);
 const d = img.data;
 const idx = (y*size + x) * 4;
 const match = (i) => d[i]===target[0] && d[i+1]===target[1] && d[i+2]===target[2];
 if (match(idx) && !(fill[0]===target[0] && fill[1]===target[1] && fill[2]===target[2])) {
  const stack = [[x,y]]; const visited = new Set();
  while (stack.length) {
   const [cx,cy] = stack.pop();
   const k = cy*size + cx; if (visited.has(k)) continue; visited.add(k);
   const i = k*4;
   if (!match(i)) continue;
   d[i]=fill[0]; d[i+1]=fill[1]; d[i+2]=fill[2]; d[i+3]=255;
   if (cx>0) stack.push([cx-1,cy]); if (cx<size-1) stack.push([cx+1,cy]);
   if (cy>0) stack.push([cx,cy-1]); if (cy<size-1) stack.push([cx,cy+1]);
  }
  ctx.putImageData(img, 0, 0);
 }
}

async function loadPartTexturesIntoList(p) {
 // 파트에 저장된 텍스처 세트 있으면 목록으로 변환, 없으면 기본 16×16 1개 생성

 texTextures = texTextures.filter(t => !t.fromPart);
 const loaded = p.textureFaces && p.textureFaces._list;
 const defaultCol = '#' + p.color.toString(16).padStart(6,'0');
 if (loaded && loaded.length) {
  for (const t of loaded) {
   const size = t.size || 16;
   const canvases = {};
   if (t.faces && typeof t.faces === 'object') {
    // 저장/불러오기에서 온 형식: { size, faces: {면: dataURL} } → 비동기 로딩
    for (const f of DISPLAY_FACES) {
     canvases[f] = t.faces[f] ? await loadDataURLToCanvas(t.faces[f], size) : makeFaceCanvas(size, defaultCol);
    }
   } else {
    // 편집 중 적용에서 온 형식: { size, canvases: {면: canvas} }
    for (const f of DISPLAY_FACES) {
     canvases[f] = (t.canvases && t.canvases[f]) ? t.canvases[f] : makeFaceCanvas(size, defaultCol);
    }
   }
   texTextures.push({ id: texSeq++, size, canvases, fromPart: true });
  }
 } else {
  // 기본: 16×16 단색 텍스처 1개 (기하존 디폴트)
  const canvases = {};
  for (const f of DISPLAY_FACES) canvases[f] = makeFaceCanvas(16, defaultCol);
  texTextures.push({ id: texSeq++, size: 16, canvases, fromPart: true });
 }
 if (texTextures.length) {
  texActiveId = texTextures[texTextures.length - 1].id;
  texActivateTexture(texActiveId);
 }
}

}

function addPart(x, y, z, w, h, d, color, rot, type, locked, textureCanvases) {
 rot = rot || 0; type = type || 'solid';
 let material;
 if (textureCanvases && DISPLAY_FACES.length) {
  material = DISPLAY_FACES.map(f => new THREE.MeshStandardMaterial({
   color: 0xffffff, map: texCanvasTexture(textureCanvases[f])
  }));
 } else {
  material = new THREE.MeshStandardMaterial({ color });
 }
 const mesh = new THREE.Mesh(
 new THREE.BoxGeometry(w, h, d),
 material
 );
 mesh.position.set(x, y, z);
 mesh.rotation.y = rot;
 mesh.castShadow = true; mesh.receiveShadow = true;
 scene.add(mesh);
 const p = { mesh, w, h, d, color, rot, type, locked: !!locked };
 if (textureCanvases) {
  p.textureFaces = { _canvases: textureCanvases };
  // 전체 텍스처 목록(해상도 포함)이 전달되면 함께 보관 → 편집기에서 복원 가능
  if (textureCanvases._list && Array.isArray(textureCanvases._list)) {
   p.textureFaces._list = textureCanvases._list;
  }
  p._isSpecialTexture = true;
 }
 applyAppearance(p);
 parts.push(p);
 return p;
}
function removePart(p) {
 if (selected === p) deselect();
 scene.remove(p.mesh);
 p.mesh.geometry.dispose();
 const mats = Array.isArray(p.mesh.material) ? p.mesh.material : [p.mesh.material];
 for (const m of mats) { if (m.map) m.map.dispose(); m.dispose(); }
 const i = parts.indexOf(p); if (i >= 0) parts.splice(i, 1);
}
function rebuildColliders() {
 colliders = parts.map(p => {
 const x = p.mesh.position.x, y = p.mesh.position.y, z = p.mesh.position.z;
 return { cx:x, cz:z, y0:y-p.h/2, y1:y+p.h/2, hw:p.w/2, hd:p.d/2, a:p.rot, type:p.type };
 });
}

 // 움직이는 발판: (a)→(b) 왕복
 const movePlat = (ax,ay,az, bx,by,bz, w,d, col, speed, phase) => {
  const p = addPart(ax,ay,az, w,0.5,d, col);
  movers.push({ kind:'move', part:p, ax,ay,az, bx,by,bz, speed:speed||1, phase:phase||0, col:null });

 };

 };
 // 체크포인트를 발판 표면 높이에 맞춤(윗면 = 발판 윗면). 부활이 발판 위에서 되게.

 addPart(0,0.5,0,10,1,10,0x3d5a80); cp(0,1,0);
 let z=8, y=1;

function joyUpdate(t) {
 const r = joyEl.getBoundingClientRect();

 if (len > max) { dx = dx / len * max; dy = dy / len * max; }
 touchMove.x = dx / max;
 touchMove.y = dy / max;
 joyKnob.style.left = (35 + (dx / max) * 25) + 'px';
 joyKnob.style.top = (35 + (dy / max) * 25) + 'px';
}
function joyReset() {

}

function setNDC(e) { ndc.x = (e.clientX/window.innerWidth)*2-1; ndc.y = -(e.clientY/window.innerHeight)*2+1; }

}

 outlines.length = 0;

 const geo = new THREE.EdgesGeometry(new THREE.BoxGeometry(p.w, p.h, p.d));

}

 scaleOrigin.copy(selected.mesh.position);

 }

 if (hits.length) {

function serialize() {
 return JSON.stringify({ v: 3, parts: parts.map(p => {
  let texData = null;
  if (p.textureFaces && Array.isArray(p.textureFaces._list) && p.textureFaces._list.length) {
   texData = { list: p.textureFaces._list.map(t => ({
    size: t.size || 16,
    faces: (() => {
     const o = {};
     if (t.canvases) {
      for (const f of DISPLAY_FACES) {
       const cv = t.canvases[f];
       if (cv) o[f] = cv.toDataURL('image/png');
      }
     }
     return o;
    })()
   })) };
  }
  return {
   x: +p.mesh.position.x.toFixed(3), y: +p.mesh.position.y.toFixed(3), z: +p.mesh.position.z.toFixed(3),
   w: p.w, h: p.h, d: p.d, color: p.color, rot: +p.rot.toFixed(4), type: p.type, locked: !!p.locked,
   texture: texData,
   faceOverrides: p.faceOverrides ? Object.fromEntries(
    Object.entries(p.faceOverrides).map(([f, o]) => [f, { size: o.size, data: o.canvas.toDataURL('image/png') }])

  };

}

}

function physics(dt) {
 const shift = keys['ShiftLeft'] || keys['ShiftRight'] || touchRun;
 const speed = inWater ? (shift ? WALK : WALK * WATER_FACTOR) : (shift ? RUN : WALK);
 const y = yawObject.rotation.y;
 forward.set(-Math.sin(y), 0, -Math.cos(y));
 right.set(Math.cos(y), 0, -Math.sin(y));

 const move = new THREE.Vector3();
 if (keys['KeyW']) move.add(forward);
 if (keys['KeyS']) move.sub(forward);
 if (keys['KeyD']) move.add(right);
 if (keys['KeyA']) move.sub(right);
 if (isTouch && (touchMove.x || touchMove.y)) {
  move.addScaledVector(forward, -touchMove.y);
  move.addScaledVector(right, touchMove.x);
 }
 const mag = Math.min(1, move.length());
 if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed * mag);

 velocity.lerp(move, 1 - Math.pow(0.001, dt));
 yawObject.position.addScaledVector(velocity, dt);

 const pos = yawObject.position, R = 0.4, H = EYE_HEIGHT;

 // 수평 충돌 (solid + checkpoint만 막힘)
 for (const c of colliders) {
 if (c.type !== 'solid' && c.type !== 'checkpoint') continue;
 const feetY = pos.y - H, headY = pos.y;
 if (feetY >= c.y1 - 0.05 || headY <= c.y0) continue;
 const ca = Math.cos(c.a), sa = Math.sin(c.a);
 const dx = pos.x - c.cx, dz = pos.z - c.cz;
 let lx = dx*ca + dz*sa, lz = -dx*sa + dz*ca;
 const bx = c.hw + R, bz = c.hd + R;
 if (lx > -bx && lx < bx && lz > -bz && lz < bz) {
 const pL = lx+bx, pR = bx-lx, pD = lz+bz, pU = bz-lz;
 const m = Math.min(pL, pR, pD, pU);
 if (m === pL) lx = -bx; else if (m === pR) lx = bx;
 else if (m === pD) lz = -bz; else lz = bz;
 pos.x = c.cx + (lx*ca - lz*sa);
 pos.z = c.cz + (lx*sa + lz*ca);
 }
 }

 // 수직: 물속이면 수영, 아니면 중력+점프
 const prevFeet = pos.y - EYE_HEIGHT; // 이동 전 발 높이(착지/천장 방향 판정용)
 if (inWater) {
 if (keys['Space']) vertVel = SWIM_UP; // 위로 떠오름
 else if (shift) vertVel = 0; // 유지 (안 가라앉음)
 else vertVel = -SINK_SPEED; // 천천히 가라앉음
 pos.y += vertVel * dt;
 } else {
 if (onGround && keys['Space']) { vertVel = (mpActive ? JUMP_SPEED * 1.5 : JUMP_SPEED); onGround = false; }
 vertVel -= GRAVITY * dt;
 pos.y += vertVel * dt;
 }
 // 바닥은 맵(그라운드 평면) 범위 안에서만 존재 → 밖은 공허로 낙하
 const half = groundSize / 2;
 let groundY = (Math.abs(pos.x) <= half && Math.abs(pos.z) <= half) ? EYE_HEIGHT : -Infinity;
 for (const c of colliders) {
 if (c.type !== 'solid' && c.type !== 'checkpoint' && c.type !== 'jump' && c.type !== 'point') continue;
 const ca = Math.cos(c.a), sa = Math.sin(c.a);
 const dx = pos.x - c.cx, dz = pos.z - c.cz;
 const lx = dx*ca + dz*sa, lz = -dx*sa + dz*ca;
 if (lx > -(c.hw+R) && lx < (c.hw+R) && lz > -(c.hd+R) && lz < (c.hd+R)) {
 const top = c.y1 + EYE_HEIGHT;
 // 착지: 아래로 이동 중이고, 직전에 발이 블록 윗면 위(또는 근처)에 있었을 때만
 if (vertVel <= 0 && prevFeet >= c.y1 - 0.05 && (pos.y - EYE_HEIGHT) <= c.y1 && top > groundY) {
  groundY = top;
 }
 // 천장: 위로 이동 중이고, 직전에 머리가 블록 밑면 아래에 있었는데 지금 밑면을 넘으면 막음
 if (vertVel > 0 && (prevFeet + EYE_HEIGHT) <= c.y0 + 0.05 && pos.y > c.y0) {
  pos.y = c.y0 - 0.02; // 머리를 블록 밑면 바로 아래로
  vertVel = 0;
 }
 }
 }
 if (pos.y <= groundY) { pos.y = groundY; vertVel = 0; onGround = true; } else onGround = false;
 // 포인트 발판: 윗면에 서면 포인트+1, 처음 스폰대로 복귀
 if (onGround) {
 for (const c of colliders) {
 if (c.type !== 'point') continue;
 const ca=Math.cos(c.a), sa=Math.sin(c.a);
 const dx=pos.x-c.cx, dz=pos.z-c.cz;
 const lx=dx*ca+dz*sa, lz=-dx*sa+dz*ca;
 const top=c.y1+EYE_HEIGHT;
 if (lx>-(c.hw+R)&&lx<(c.hw+R)&&lz>-(c.hd+R)&&lz<(c.hd+R) && Math.abs(pos.y-top)<0.2) {
 playerPoints += 1;
 try { localStorage.setItem('fpsPoints', String(playerPoints)); } catch(e){}
 flash('🏆 포인트 +1 (총 ' + playerPoints + ')');
 // 처음 스폰대로 복귀 + 체크포인트도 처음으로 리셋
 yawObject.position.set(ARENA_SPAWN.x, ARENA_SPAWN.y, ARENA_SPAWN.z);
 respawnPoint.set(ARENA_SPAWN.x, ARENA_SPAWN.y, ARENA_SPAWN.z);
 vertVel = 0; velocity.set(0,0,0); lastCheckpointKey = null;
 try { localStorage.removeItem('fpsArenaCP'); } catch(e){} // 저장된 체크포인트도 초기화(처음부터)
 break;
 }
 }
 }
 // 아레나에선 초록 그라운드 평면(EYE_HEIGHT 기본 바닥)을 밟으면 죽음
 if (mpActive && onGround && Math.abs(groundY - EYE_HEIGHT) < 0.001
 && Math.abs(pos.x) <= half && Math.abs(pos.z) <= half) {
 respawn(); return;
 }
 // 점프패드: 윗면에 착지하는 순간 크게 튕김
 if (onGround) {
 for (const c of colliders) {
 if (c.type !== 'jump') continue;
 const ca=Math.cos(c.a), sa=Math.sin(c.a);
 const dx=pos.x-c.cx, dz=pos.z-c.cz;
 const lx=dx*ca+dz*sa, lz=-dx*sa+dz*ca;
 const top=c.y1+EYE_HEIGHT;
 if (lx>-(c.hw+R)&&lx<(c.hw+R)&&lz>-(c.hd+R)&&lz<(c.hd+R) && Math.abs(pos.y-top)<0.15) {
  vertVel = JUMP_SPEED * 2.4; // 강하게 튕겨 오름
  onGround = false;
 }
 }
 }

let glowT = 0;
function updateGlow(dt) {
 glowT += dt;
 for (const p of parts) {
  const mats = Array.isArray(p.mesh.material) ? p.mesh.material : [p.mesh.material];
  if (p.type === 'checkpoint') { for (const m of mats) { m.emissiveIntensity = 0.6 + 0.4 * Math.sin(glowT * 3); } }
  else if (p.type === 'lava') { for (const m of mats) { m.emissiveIntensity = 0.85 + 0.25 * Math.sin(glowT * 5); } }
 }
}

function updateMovers(t) {
 for (const mv of movers) {
  if (!mv.col) continue;
  if (mv.kind === 'move') {
   const s = (Math.sin(t * mv.speed + mv.phase) + 1) / 2; // 0~1
   const nx = mv.ax + (mv.bx - mv.ax) * s;
   const ny = mv.ay + (mv.by - mv.ay) * s;
   const nz = mv.az + (mv.bz - mv.az) * s;
   mv.part.mesh.position.set(nx, ny, nz);
   mv.col.cx = nx; mv.col.cz = nz;
   mv.col.y0 = ny - mv.part.h/2; mv.col.y1 = ny + mv.part.h/2;
  } else if (mv.kind === 'rotate') {
   const ang = t * mv.speed + mv.phase;
   mv.part.mesh.rotation.y = ang;
   mv.col.a = -ang; // 충돌식이 rotation.y와 반대 방향이라 부호 맞춤 (시각=판정 일치)
  }
 }
}

function lerpAngle(a, b, t) {
 let diff = b - a;
 while (diff > Math.PI) diff -= Math.PI * 2;
 while (diff < -Math.PI) diff += Math.PI * 2;
 return a + diff * t;
}
function updateRemotePlayers(dt) {
 const k = Math.min(1, dt * 12); // 따라가는 속도(클수록 빠르게 스냅)
 for (const id in remotePlayers) {
  const rp = remotePlayers[id];
  if (rp.tx === undefined) continue;
  const p = rp.fig.position;
  p.x += (rp.tx - p.x) * k;
  p.y += (rp.ty - p.y) * k;
  p.z += (rp.tz - p.z) * k;
  rp.fig.rotation.y = lerpAngle(rp.fig.rotation.y, rp.tr, k);
 }
}

function makeRoomCode() {
 const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // 헷갈리는 0,O,1,I 제외
 let s = '';
 for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
 return s;
}
const FACE_COUNT = 6;
function drawFaceCanvas(idx, skinHex) {
 const cv = document.createElement('canvas'); cv.width = 64; cv.height = 64;
 const x = cv.getContext('2d');
 x.fillStyle = '#' + (skinHex>>>0).toString(16).padStart(6,'0').slice(-6); x.fillRect(0,0,64,64);
 x.fillStyle = '#000';
 const eye = (ex,ey,type) => {
  if (type==='dot'){ x.fillRect(ex-4,ey-4,8,8); }
  else if (type==='line'){ x.fillRect(ex-6,ey,12,3); } // 감은 눈
  else if (type==='wink'){ x.fillRect(ex-6,ey,12,3); } // 윙크(한쪽)
 };
 // idx별 표정
 if (idx===0){ eye(20,26,'dot'); eye(44,26,'dot'); x.fillRect(24,44,16,4); } // 무표정
 else if (idx===1){ eye(20,26,'dot'); eye(44,26,'dot'); x.beginPath(); x.arc(32,42,10,0,Math.PI); x.lineWidth=4; x.strokeStyle='#000'; x.stroke(); } // 웃음
 else if (idx===2){ eye(20,26,'line'); eye(44,26,'line'); x.fillRect(26,44,12,4); } // 졸림(감은눈)
 else if (idx===3){ eye(20,26,'dot'); eye(44,26,'wink'); x.beginPath(); x.arc(32,42,9,0,Math.PI); x.lineWidth=4; x.strokeStyle='#000'; x.stroke(); } // 윙크
 else if (idx===4){ eye(20,24,'dot'); eye(44,24,'dot'); x.beginPath(); x.arc(32,46,7,Math.PI,Math.PI*2); x.lineWidth=4; x.strokeStyle='#000'; x.stroke(); } // 시무룩
 else { eye(20,26,'dot'); eye(44,26,'dot'); x.beginPath(); x.arc(32,44,7,0,Math.PI*2); x.fillStyle='#000'; x.fill(); } // 놀람(O입)
 const tex = new THREE.CanvasTexture(cv); tex.needsUpdate = true; return tex;
}
function headMaterials(faceIdx, skinHex) {
 // BoxGeometry 면 순서: +x,-x,+y,-y,+z,-z → +z(4번)가 앞면
 const plain = () => new THREE.MeshStandardMaterial({ color: skinHex });
 const face = new THREE.MeshStandardMaterial({ map: drawFaceCanvas(faceIdx, skinHex) });
 return [plain(),plain(),plain(),plain(),face,plain()];
}
function makeCharacter(colors) {
 const g = new THREE.Group();
 const c = colors || {};
 const skin=c.skin!==undefined?c.skin:0xe8b88a, shirt=c.shirt!==undefined?c.shirt:0x3498db, pants=c.pants!==undefined?c.pants:0x2c3e50;
 const add=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);g.add(m);};
 add(0.8,0.8,0.8,skin,0,2.1,0); add(1.0,1.2,0.5,shirt,0,1.2,0);
 add(0.3,1.1,0.3,skin,-0.65,1.2,0); add(0.3,1.1,0.3,skin,0.65,1.2,0);
 add(0.35,1.1,0.35,pants,-0.25,0.35,0); add(0.35,1.1,0.35,pants,0.25,0.35,0);
 // 머리: 표정 텍스처 6면(앞면 +z) 적용
 const headMat = new THREE.Mesh(new THREE.BoxGeometry(0.8,0.8,0.8), headMaterials(c.face!==undefined?c.face:0, skin));
 headMat.position.set(0,2.1,0); g.add(headMat);
 return g;
}
function makeNameTag(text) {

}

// ═══ Firebase 위치 동기화 시작 (P2P/호스트/턴/NAT 개념 제거) ═══
function startFirebaseSync() {
 mpActive = true; mpSyncOn = true;
 mpLog('✅ 멀티 접속됨 (Firebase 동기화)');
 fbPlayersRef = fbdb.ref('players');
 fbMeRef = fbdb.ref('players/' + myPlayerId);
 // 접속 끊기면 자동으로 내 데이터 삭제
 try { fbMeRef.onDisconnect().remove(); } catch(e){}
 // 다른 플레이어 변화 구독
 fbPlayersRef.on('child_added', onPlayerUpdate);
 fbPlayersRef.on('child_changed', onPlayerUpdate);
 // 접속 인원 실시간 표시
 fbPlayersRef.on('value', (snap) => {
  mpPlayerCount = snap.numChildren();
  const el = document.getElementById('mpMainInfo');
  if (el) el.textContent = '현재 ' + mpPlayerCount + '명 접속 중';
 });
 fbPlayersRef.on('child_removed', (snap) => {
  const id = snap.key;
  if (remotePlayers[id]) { if (remotePlayers[id].fig) scene.remove(remotePlayers[id].fig); delete remotePlayers[id]; }
 });
 // 채팅 구독 (최근 메시지)
 fbdb.ref('chat').limitToLast(1).on('child_added', (snap) => {
  const c = snap.val(); if (!c) return;
  if (c.nick === playerNick) return; // 내 메시지 스킵 (로컬 addChatLine으로 이미 표시)
  if (c.t && Date.now() - c.t < 15000) addChatLine(c.nick, String(c.text||'').slice(0,120), false);
 });
 enterMultiplayerGame();
}

function onPlayerUpdate(snap) {
 const id = snap.key; if (id === myPlayerId) return; // 내 것 무시
 const d = snap.val(); if (!d || typeof d.x !== 'number') return;
 if (!remotePlayers[id]) {
  const fig = makeCharacter({skin:d.skin, shirt:d.shirt, pants:d.pants, face:d.face}); const tag = makeNameTag(d.nick); fig.add(tag); scene.add(fig);
  remotePlayers[id] = { fig, nick: d.nick, tag, fresh: true, tx: d.x, ty: d.y - 1.7, tz: d.z, tr: d.ry };
 }
 const rp = remotePlayers[id];
 if (d.nick && d.nick !== rp.nick) { if (rp.tag) rp.fig.remove(rp.tag); const nt = makeNameTag(d.nick); rp.fig.add(nt); rp.tag = nt; rp.nick = d.nick; }
 // 목표 위치/회전 저장 (매 프레임 보간해서 이동)
 rp.tx = d.x; rp.ty = d.y - 1.7; rp.tz = d.z; rp.tr = d.ry;
 // 처음 생성 직후엔 목표로 바로 스냅(멀리서 날아오는 것 방지)
 if (rp.fresh) { rp.fig.position.set(rp.tx, rp.ty, rp.tz); rp.fig.rotation.y = rp.tr; rp.fresh = false; }
 if (d.face !== undefined && d.face !== rp.face) {
  rp.face = d.face;
  // 머리 메시(그룹의 첫 자식이 head) 재질 교체
  const head = rp.fig.children.find(ch => ch.geometry && ch.geometry.parameters && ch.geometry.parameters.width===0.8 && ch.geometry.parameters.height===0.8);
  if (head) head.material = headMaterials(d.face, d.skin!==undefined?d.skin:0xe8b88a);
 }
}

// P2P '참가' 제거 — 모두 Firebase 동기화로 전환
if (mpJoin) mpJoin.addEventListener('click', (e) => { e.stopPropagation(); if (!fbdb) { mpLog('DB 연결 안 됨'); return; } startFirebaseSync(); });
if (mpBtn) mpBtn.addEventListener('click', (e) => { e.stopPropagation(); mpPanel.style.display = 'flex'; });
if (mpClose) mpClose.addEventListener('click', (e) => { e.stopPropagation(); if (mpActive) leaveMultiplayer(); mpPanel.style.display = 'none'; });
if (mpCodeInput) { ['pointerdown','touchstart','mousedown','click'].forEach(ev => mpCodeInput.addEventListener(ev, (e) => e.stopPropagation())); }
const mpRooms = document.getElementById('mpRooms');
const roomAdmin = document.getElementById('roomAdmin');
const roomList = document.getElementById('roomList');
const roomAdminClose = document.getElementById('roomAdminClose');
if (mpRooms) mpRooms.addEventListener('click', (e) => {
 e.stopPropagation();
 const pw = prompt('관리자 비밀번호');
 if (pw !== '12345678') { mpLog('비밀번호 틀림'); return; }
 roomAdmin.style.display = 'flex';
 watchRooms();
});
if (roomAdminClose) roomAdminClose.addEventListener('click', (e) => { e.stopPropagation(); roomAdmin.style.display = 'none'; if (fbdb) fbdb.ref('rooms').off(); });
function watchRooms() {
 if (!fbdb) { roomList.textContent = 'DB 연결 안 됨'; return; }
 fbdb.ref('rooms').on('value', (snap) => {
  const rooms = snap.val() || {};
  const keys = Object.keys(rooms);
  if (!keys.length) { roomList.innerHTML = '<div style="opacity:0.6">열린 방 없음</div>'; return; }
  roomList.innerHTML = '';
  keys.forEach((k) => {
   const r = rooms[k];
   const row = document.createElement('div');
   row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px;border-bottom:1px solid #2a3542';
   row.innerHTML = '<span>코드 <b>' + k + '</b> · ' + (r.count || 0) + '명</span>';
   const del = document.createElement('button');
   del.textContent = '삭제'; del.style.cssText = 'background:#e74c3c;color:#fff;border:none;border-radius:6px;padding:6px 12px;cursor:pointer';
   del.onclick = () => fbdb.ref('rooms/' + k).remove();
   row.appendChild(del);
   roomList.appendChild(row);
  });
 });
}
if (mpRooms) { ['pointerdown','touchstart','mousedown','click'].forEach(ev => mpRooms.addEventListener(ev, (e) => e.stopPropagation())); }
</script>
</body>
</html>
