<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Prototype</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
  #app { width: 100vw; height: 100vh; display: block; }
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); color: #fff; cursor: pointer; z-index: 10;
    transition: opacity 0.2s;
  }
  #overlay h1 { font-size: 22px; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.5px; }
  #overlay p { font-size: 14px; opacity: 0.75; line-height: 1.7; text-align: center; }
  #overlay kbd {
    background: #222; border: 1px solid #444; border-radius: 4px;
    padding: 2px 7px; font-size: 12px; margin: 0 2px;
  }
  #hud {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    color: #7dd3fc; font-size: 12px; font-family: monospace;
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px;
    line-height: 1.6; pointer-events: none;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%; z-index: 5;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,0.85);
    pointer-events: none; display: none;
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div id="crosshair"></div>
<div id="hud"></div>
<div id="overlay">
  <h1>클릭해서 시작</h1>
  <p>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동 &nbsp;·&nbsp; 마우스 시점 &nbsp;·&nbsp; <kbd>Shift</kbd> 달리기<br>
    <kbd>ESC</kbd> 마우스 잠금 해제
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
const canvas = document.getElementById('app');
const overlay = document.getElementById('overlay');
const hud = document.getElementById('hud');
const crosshair = document.getElementById('crosshair');

// --- Scene ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b8e8);
scene.fog = new THREE.Fog(0x87b8e8, 40, 120);

// --- Camera (eye) ---
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const EYE_HEIGHT = 1.7;
camera.position.set(0, EYE_HEIGHT, 0);

// yaw/pitch container so we control look cleanly
const yawObject = new THREE.Object3D();   // rotates left/right
const pitchObject = new THREE.Object3D(); // rotates up/down
yawObject.position.copy(camera.position);
yawObject.add(pitchObject);
pitchObject.add(camera);
camera.position.set(0, 0, 0);
scene.add(yawObject);

// --- Renderer ---
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

// --- Lights ---
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
scene.add(sun);

// --- Ground ---
const groundSize = 200;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(groundSize, groundSize),
  new THREE.MeshStandardMaterial({ color: 0x4a7a4a })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// grid so movement is readable
const grid = new THREE.GridHelper(groundSize, 100, 0x336633, 0x3d6b3d);
grid.position.y = 0.01;
scene.add(grid);

// --- Reference boxes ---
const boxMat = [0xe74c3c, 0xf39c12, 0x3498db, 0x9b59b6, 0x1abc9c];
for (let i = 0; i < 24; i++) {
  const s = 1 + Math.random() * 3;
  const box = new THREE.Mesh(
    new THREE.BoxGeometry(s, s, s),
    new THREE.MeshStandardMaterial({ color: boxMat[i % boxMat.length] })
  );
  const angle = Math.random() * Math.PI * 2;
  const dist = 8 + Math.random() * 70;
  box.position.set(Math.cos(angle) * dist, s / 2, Math.sin(angle) * dist);
  box.castShadow = true;
  box.receiveShadow = true;
  scene.add(box);
}

// --- Pointer lock ---
let locked = false;
overlay.addEventListener('click', () => canvas.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  overlay.style.display = locked ? 'none' : 'flex';
  crosshair.style.display = locked ? 'block' : 'none';
});

// --- Mouse look ---
const PITCH_LIMIT = Math.PI / 2 - 0.05;
document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  const sens = 0.0022;
  yawObject.rotation.y -= e.movementX * sens;
  pitchObject.rotation.x -= e.movementY * sens;
  pitchObject.rotation.x = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitchObject.rotation.x));
});

// --- Keyboard ---
const keys = {};
document.addEventListener('keydown', (e) => keys[e.code] = true);
document.addEventListener('keyup', (e) => keys[e.code] = false);

// --- Movement ---
const WALK = 6, RUN = 11;
const velocity = new THREE.Vector3();
const forward = new THREE.Vector3();
const right = new THREE.Vector3();
const clock = new THREE.Clock();

function update(dt) {
  const speed = keys['ShiftLeft'] || keys['ShiftRight'] ? RUN : WALK;

  // direction from yaw only (stay on ground plane)
  forward.set(Math.sin(yawObject.rotation.y), 0, Math.cos(yawObject.rotation.y)).negate();
  right.set(forward.z, 0, -forward.x);

  const move = new THREE.Vector3();
  if (keys['KeyW']) move.add(forward);
  if (keys['KeyS']) move.sub(forward);
  if (keys['KeyD']) move.add(right);
  if (keys['KeyA']) move.sub(right);
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);

  // smooth accel/decel
  velocity.lerp(move, 1 - Math.pow(0.001, dt));
  yawObject.position.addScaledVector(velocity, dt);

  // clamp inside ground
  const lim = groundSize / 2 - 1;
  yawObject.position.x = Math.max(-lim, Math.min(lim, yawObject.position.x));
  yawObject.position.z = Math.max(-lim, Math.min(lim, yawObject.position.z));
  yawObject.position.y = EYE_HEIGHT;

  const p = yawObject.position;
  hud.textContent = `pos  x:${p.x.toFixed(1)}  z:${p.z.toFixed(1)}\nspeed ${velocity.length().toFixed(1)} m/s`;
}

function animate() {
  requestAnimationFrame(animate);
  update(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
